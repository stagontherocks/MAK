<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Top Gainers — GrabMyStone</title>
<link rel="icon" href="images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:#111111;color:#eeeeee;
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
  }
  .wrap{max-width:1240px;margin:0 auto;padding:0 24px}

  .navbar{
    position:sticky;top:0;z-index:100;
    background:#111111;border-bottom:1px solid #262626;
  }
  .navbar .wrap{
    height:58px;display:flex;align-items:center;justify-content:space-between;gap:24px;
  }
  .nav-links{display:flex;align-items:center;gap:8px}
  .nav-links a{
    padding:10px 16px;border-radius:999px;font-weight:600;font-size:13px;
    color:#c2c2c2;text-decoration:none;transition:background .15s ease,color .15s ease;
  }
  .nav-links a:hover{background:#1c1c1c;color:#ffffff}
  .nav-links a.up{color:#2ecc71}
  .nav-links a.up:hover{background:rgba(46,204,113,.12)}
  .nav-links a.down{color:#ff4d4f}
  .nav-links a.down:hover{background:rgba(255,77,79,.12)}
  .nav-links a.active{background:#1c1c1c;color:#ffffff}
  .nav-links a.down.active{background:rgba(255,77,79,.15);color:#ff4d4f}
  .nav-links a.up.active{background:rgba(46,204,113,.15);color:#2ecc71}

  .connect-btn{
    display:inline-flex;align-items:center;padding:9px 16px;border-radius:8px;
    background:#2ecc71;color:#0d1f14;font-size:13px;font-weight:700;text-decoration:none;
    transition:background .15s ease;
  }
  .connect-btn:hover{background:#3ee082}
  .connect-btn.connected{background:#1c1c1c;color:#ff4d4f;border:1px solid #262626}
  .connect-btn.connected:hover{background:rgba(255,77,79,.12)}

  main{padding:32px 0 64px}

  .grid-toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px;flex-wrap:wrap;row-gap:12px}
  .grid-toolbar-left{display:flex;align-items:center;gap:16px;flex-wrap:wrap;row-gap:12px}
  .toolbar-divider{width:1px;height:24px;background:#262626;flex-shrink:0}
  .select-input{
    background:#161616 url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%23787878" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>') no-repeat right 12px center/14px;
    border:1px solid #262626;color:#eeeeee;
    font-family:inherit;font-size:13px;font-weight:600;
    padding:9px 32px 9px 14px;border-radius:8px;
    appearance:none;-webkit-appearance:none;cursor:pointer;flex-shrink:0;
  }
  .select-input:hover{border-color:#3a3a3a}
  .select-input:focus{outline:none;border-color:#4a4a4a}
  .search-wrap{position:relative;width:220px}
  .search-input{
    background:#161616 url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%23787878" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>') no-repeat 14px center/14px;
    border:1px solid #262626;color:#eeeeee;
    font-family:inherit;font-size:13px;font-weight:600;
    padding:9px 34px 9px 38px;border-radius:8px;
    width:100%;
  }
  .search-input::placeholder{color:#787878;font-weight:500}
  .search-input:hover{border-color:#3a3a3a}
  .search-input:focus{outline:none;border-color:#4a4a4a}
  .search-clear{
    position:absolute;top:50%;right:8px;transform:translateY(-50%);
    width:20px;height:20px;border:none;border-radius:999px;
    background:#262626;color:#c2c2c2;font-size:15px;line-height:1;
    cursor:pointer;display:flex;align-items:center;justify-content:center;
    font-family:inherit;padding:0;
  }
  .search-clear:hover{background:#3a3a3a;color:#ffffff}
  .search-clear[hidden]{display:none}

  .toolbar-right{display:flex;align-items:center;gap:16px}
  .screener-status{font-size:13px;font-weight:600;color:#787878}
  .refresh-btn{
    flex-shrink:0;display:inline-flex;align-items:center;padding:8px 14px;border-radius:8px;
    background:#1c1c1c;border:1px solid #262626;color:#eeeeee;font-size:13px;font-weight:600;
    cursor:pointer;transition:background .15s ease;
  }
  .refresh-btn:hover{background:#262626}
  .refresh-btn:disabled{opacity:.5;cursor:not-allowed}

  .grid-card{
    background:#161616;border:1px solid #262626;border-radius:10px;overflow:hidden;
  }
  .grid-scroll{overflow:auto;max-height:calc(100vh - 220px)}
  table{width:100%;border-collapse:collapse;min-width:560px}
  thead th{
    position:sticky;top:0;z-index:1;
    background:#1a1a1a;
    text-align:right;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
    color:#787878;padding:12px 16px;border-bottom:1px solid #262626;white-space:nowrap;
  }
  thead th:first-child{text-align:left}
  thead th.sortable{cursor:pointer;user-select:none}
  thead th.sortable:hover{color:#c2c2c2}
  thead th.sort-asc::after{content:" \25B2"}
  thead th.sort-desc::after{content:" \25BC"}
  tbody td{
    padding:12px 16px;font-size:13px;text-align:right;border-bottom:1px solid #1e1e1e;
    font-variant-numeric:tabular-nums;color:#eeeeee;white-space:nowrap;
  }
  tbody td:first-child{text-align:left;font-weight:700}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover td{background:#1c1c1c}
  .price-up{color:#2ecc71}
  .price-down{color:#ff4d4f}
</style>
</head>
<body>

<header class="navbar">
  <div class="wrap">
    <nav class="nav-links">
      <a href="trading.html">Arbitrage</a>
      <a href="top-losers.html" class="down">Top Losers</a>
      <a href="top-gainers.html" class="up active">Top Gainers</a>
      <a href="hiv-stocks.html">High IV</a>
      <a href="watchlist.html">Watchlist</a>
      <a href="positions.html">Positions</a>
    </nav>
    <a href="/api/fyers/login" class="connect-btn" id="connectBtn">Connect Broker</a>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="grid-toolbar">
      <div class="grid-toolbar-left">
        <div class="search-wrap">
          <input type="text" class="search-input" id="stockSearch" placeholder="Search stock..." aria-label="Search stocks">
          <button type="button" class="search-clear" id="stockSearchClear" aria-label="Clear search" hidden>&times;</button>
        </div>
        <div class="toolbar-divider"></div>
        <select class="select-input" id="timeFilter" aria-label="Time period">
          <option value="d1" selected>Today</option>
          <option value="m1">1 Month</option>
          <option value="m3">3 Months</option>
          <option value="m6">6 Months</option>
          <option value="ath">ATH (52W High)</option>
        </select>
      </div>
      <div class="toolbar-right">
        <div class="screener-status" id="screenerStatus">Starting scan...</div>
        <button type="button" class="refresh-btn" id="refreshBtn">Refresh</button>
      </div>
    </div>
    <div class="grid-card">
      <div class="grid-scroll">
        <table>
          <thead>
            <tr>
              <th>Stock Name</th>
              <th class="sortable" id="thLtp">LTP</th>
              <th class="sortable" id="thChg">Change</th>
              <th class="sortable" id="thPct">% Change</th>
            </tr>
          </thead>
          <tbody id="gridBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</main>

<script>
  var connectBtn = document.getElementById('connectBtn');
  function markBrokerConnected(){
    if (connectBtn.classList.contains('connected')) return;
    connectBtn.setAttribute('href', '/api/fyers/logout');
    connectBtn.classList.add('connected');
    connectBtn.textContent = 'Disconnect';
  }
  function markBrokerDisconnected(){
    connectBtn.setAttribute('href', '/api/fyers/login');
    connectBtn.classList.remove('connected');
    connectBtn.textContent = 'Connect Broker';
  }
  fetch('/api/fyers/status').then(function(res){ return res.json(); }).then(function(body){
    if (body && body.loggedIn) markBrokerConnected();
  }).catch(function(){});
  connectBtn.addEventListener('click', function(e){
    if (!connectBtn.classList.contains('connected')) return;
    e.preventDefault();
    fetch('/api/fyers/logout').catch(function(){}).then(function(){
      markBrokerDisconnected();
      clearCache();
      rows = [];
      renderRows();
      statusEl.textContent = 'Disconnected. Click Refresh once reconnected to run the scan.';
    });
  });

  var BATCH_LIMIT = 10;
  // Bumped to v2 when the `ath` field was added -- v1 caches predate it and
  // would otherwise render blank ATH values until a manual Refresh.
  var CACHE_KEY = 'topGainersCache_v2';
  var rows = [];
  var isScanning = false;
  var statusEl = document.getElementById('screenerStatus');
  var gridBody = document.getElementById('gridBody');
  var refreshBtn = document.getElementById('refreshBtn');

  function loadCache(){
    try {
      var raw = localStorage.getItem(CACHE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (err) { return null; }
  }
  function saveCache(){
    try {
      localStorage.setItem(CACHE_KEY, JSON.stringify({ rows: rows, statusText: statusEl.textContent }));
    } catch (err) { /* storage unavailable/full -- keep working without persistence */ }
  }
  function clearCache(){
    try { localStorage.removeItem(CACHE_KEY); } catch (err) {}
  }

  function fmtNum(value){
    return value.toLocaleString('en-IN', { maximumFractionDigits: 2 });
  }
  function fmtPct(value){
    if (value === null || value === undefined) return '—';
    return (value > 0 ? '+' : '') + value.toFixed(2) + '%';
  }
  function pctClass(value){
    if (value === null || value === undefined) return '';
    return value > 0 ? 'price-up' : (value < 0 ? 'price-down' : '');
  }
  // ATH ("% from the 52-week high") is always <=0 by construction, so
  // coloring it by literal sign would paint this GAINERS page red -- looks
  // backwards even though the math is right. Force green instead; a small
  // magnitude (close to the high) is the interesting case here.
  function rowColorClass(value){
    if (timeKey === 'ath') return (value === null || value === undefined) ? '' : 'price-up';
    return pctClass(value);
  }

  // Which period backs both the Change/% Change columns and the ranking --
  // driven by the Time dropdown, mirroring top-losers.html.
  var timeKey = 'd1';
  // Fyers gives us ltp + % change per period; derive the absolute rupee
  // change from those two (same technique as watchlist.html) rather than
  // needing the backend to also return per-period rupee deltas.
  function changeFor(r){
    var pct = r[timeKey];
    if (r.ltp === null || r.ltp === undefined || pct === null || pct === undefined) return null;
    return r.ltp - r.ltp / (1 + pct / 100);
  }

  // Single-column sort, 3-state cycle (desc -> asc -> unsorted), same model
  // as trading.html's profit-column sort. Defaults to % Change descending on
  // load (biggest gainers first for the selected period) -- the mirror
  // image of top-losers.html's default.
  var SORT_VALUE_GETTERS = {
    ltp: function(r){ return r.ltp; },
    chg: changeFor,
    pct: function(r){ return r[timeKey]; }
  };
  var sortState = { column: 'pct', direction: 'desc' };
  var sortHeaderIds = ['thLtp', 'thChg', 'thPct'];

  function sortedRows(){
    var getValue = SORT_VALUE_GETTERS[sortState.column];
    if (!getValue) return rows.slice();
    return rows.slice().sort(function(a, b){
      var av = getValue(a), bv = getValue(b);
      if (av === null || av === undefined) return 1;
      if (bv === null || bv === undefined) return -1;
      return sortState.direction === 'asc' ? av - bv : bv - av;
    });
  }

  // This is a GAINERS grid -- always only actual advancers (pct > 0), never
  // every stock regardless of direction. Not meaningful for ATH (a
  // proximity-to-high measure, always <=0, not a signed return), so that
  // period shows every stock instead.
  function passesDirectionFilter(r){
    if (timeKey === 'ath') return true;
    var pct = r[timeKey];
    return pct !== null && pct !== undefined && pct > 0;
  }

  function renderRows(){
    var term = searchInput.value.trim().toUpperCase();
    var visible = sortedRows().filter(function(r){
      return r.symbol.indexOf(term) !== -1 && passesDirectionFilter(r);
    });
    gridBody.innerHTML = visible.map(function(r){
      var pct = r[timeKey];
      var change = changeFor(r);
      return '<tr>' +
        '<td>' + r.symbol + '</td>' +
        '<td>' + (r.ltp !== null && r.ltp !== undefined ? fmtNum(r.ltp) : '—') + '</td>' +
        '<td class="' + rowColorClass(change) + '">' + (change !== null ? (change > 0 ? '+' : '') + fmtNum(change) : '—') + '</td>' +
        '<td class="' + rowColorClass(pct) + '">' + fmtPct(pct) + '</td>' +
        '</tr>';
    }).join('');
  }

  function bindSortHeader(id, column){
    var th = document.getElementById(id);
    th.addEventListener('click', function(){
      if (sortState.column === column) {
        if (sortState.direction === 'desc') {
          sortState.direction = 'asc';
        } else {
          sortState.column = null;
          sortState.direction = 'desc';
        }
      } else {
        sortState.column = column;
        sortState.direction = 'desc';
      }
      sortHeaderIds.forEach(function(hid){ document.getElementById(hid).classList.remove('sort-asc', 'sort-desc'); });
      if (sortState.column) th.classList.add(sortState.direction === 'asc' ? 'sort-asc' : 'sort-desc');
      renderRows();
    });
  }
  bindSortHeader('thLtp', 'ltp');
  bindSortHeader('thChg', 'chg');
  bindSortHeader('thPct', 'pct');
  document.getElementById('thPct').classList.add('sort-desc');

  var searchInput = document.getElementById('stockSearch');
  var searchClear = document.getElementById('stockSearchClear');
  searchInput.addEventListener('input', function(){
    searchClear.hidden = searchInput.value.trim().length === 0;
    renderRows();
  });
  searchClear.addEventListener('click', function(){
    searchInput.value = '';
    searchClear.hidden = true;
    renderRows();
    searchInput.focus();
  });

  var timeSelect = document.getElementById('timeFilter');
  timeSelect.addEventListener('change', function(){
    timeKey = timeSelect.value;
    renderRows();
  });

  // Reuses the same /api/fyers/gainers endpoint as top-losers.html -- it
  // already returns every F&O stock's full period set, so "gainers" is
  // purely a client-side default-sort/direction difference, not a
  // different data feed.
  function fetchBatch(offset){
    fetch('/api/fyers/gainers?offset=' + offset + '&limit=' + BATCH_LIMIT)
      .then(function(res){
        if (res.status === 401) {
          statusEl.textContent = 'Connect your broker (top right) to run the scan.';
          return null;
        }
        markBrokerConnected();
        return res.json();
      })
      .then(function(body){
        if (!body) { isScanning = false; refreshBtn.disabled = false; return; }
        if (body.status !== 'ok') {
          statusEl.textContent = 'Scan failed: ' + (body.message || body.error || 'unknown error');
          isScanning = false;
          refreshBtn.disabled = false;
          return;
        }
        rows = rows.concat(body.results);
        renderRows();
        var scanned = Math.min(offset + BATCH_LIMIT, body.total);
        if (body.nextOffset !== null) {
          statusEl.textContent = 'Scanning ' + scanned + '/' + body.total + '...';
          fetchBatch(body.nextOffset);
        } else {
          statusEl.textContent = 'Done — ' + rows.length + ' of ' + body.total + ' F&O stocks.';
          isScanning = false;
          refreshBtn.disabled = false;
          saveCache();
        }
      })
      .catch(function(){
        statusEl.textContent = 'Network error, retrying...';
        setTimeout(function(){ fetchBatch(offset); }, 3000);
      });
  }

  function startScan(){
    if (isScanning) return;
    isScanning = true;
    refreshBtn.disabled = true;
    rows = [];
    renderRows();
    statusEl.textContent = 'Starting scan...';
    fetchBatch(0);
  }

  refreshBtn.addEventListener('click', function(){
    clearCache();
    startScan();
  });

  // Same rationale as hiv-stocks.html: don't re-run the ~210-symbol history
  // scan on every visit -- show a completed cached scan immediately and
  // require an explicit Refresh (or a disconnect/reconnect, which clears it).
  var cached = loadCache();
  if (cached) {
    rows = cached.rows || [];
    renderRows();
    statusEl.textContent = (cached.statusText || 'Loaded cached results.') + ' Click Refresh to rescan.';
  } else {
    startScan();
  }
</script>
</body>
</html>
