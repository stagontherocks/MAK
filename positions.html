<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Positions — GrabMyStone</title>
<link rel="icon" href="images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:#111111;color:#eeeeee;
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
  }
  .wrap{max-width:1240px;margin:0 auto;padding:0 24px}

  .navbar{
    position:sticky;top:0;z-index:100;
    background:#111111;border-bottom:1px solid #262626;
  }
  .navbar .wrap{
    height:58px;display:flex;align-items:center;justify-content:space-between;gap:24px;
  }
  .nav-links{display:flex;align-items:center;gap:8px}
  .nav-links a{
    padding:10px 16px;border-radius:999px;font-weight:600;font-size:13px;
    color:#c2c2c2;text-decoration:none;transition:background .15s ease,color .15s ease;
  }
  .nav-links a:hover{background:#1c1c1c;color:#ffffff}
  .nav-links a.up{color:#2ecc71}
  .nav-links a.up:hover{background:rgba(46,204,113,.12)}
  .nav-links a.down{color:#ff4d4f}
  .nav-links a.down:hover{background:rgba(255,77,79,.12)}
  .nav-links a.active{background:#1c1c1c;color:#ffffff}
  .nav-links a.down.active{background:rgba(255,77,79,.15);color:#ff4d4f}
  .nav-links a.up.active{background:rgba(46,204,113,.15);color:#2ecc71}

  .connect-btn{
    display:inline-flex;align-items:center;padding:9px 16px;border-radius:8px;
    background:#2ecc71;color:#0d1f14;font-size:13px;font-weight:700;text-decoration:none;
    transition:background .15s ease;
  }
  .connect-btn:hover{background:#3ee082}
  .connect-btn.connected{background:#1c1c1c;color:#ff4d4f;border:1px solid #262626}
  .connect-btn.connected:hover{background:rgba(255,77,79,.12)}

  main{padding:20px 0}

  .positions-toolbar{display:flex;align-items:center;justify-content:flex-end;margin-bottom:16px}
  .add-strategy-btn{
    display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:8px;
    background:#2ecc71;color:#0d1f14;font-size:13px;font-weight:700;font-family:inherit;
    border:none;cursor:pointer;transition:background .15s ease;
  }
  .add-strategy-btn:hover{background:#3ee082}

  .grid-card{
    background:#161616;border:1px solid #262626;border-radius:10px;overflow:hidden;
  }
  .empty-state{padding:48px 16px;text-align:center;color:#787878;font-size:13px;font-weight:600}

  /* ---------- position rows ---------- */
  /* not a <table> -- each row's stacked symbol+date on the left and the
     future expandable detail panel below don't map cleanly onto table
     cell semantics, so this is a plain flex row list instead, matching
     the reference design's card-row layout. */
  .position-row{
    display:flex;align-items:center;gap:20px;padding:18px 20px;
    border-bottom:1px solid #1e1e1e;cursor:pointer;
  }
  .position-row:last-child{border-bottom:none}
  .position-row:hover{background:#1c1c1c}
  .pr-name{flex:0 0 180px;min-width:0}
  .pr-symbol{font-weight:700;font-size:15px}
  .pr-price{flex:0 0 200px}
  .pr-ltp{font-weight:700;font-size:15px}
  .pr-chg{font-weight:700;font-size:15px;margin-left:6px}
  .pr-date{flex:0 0 160px;font-size:12px;color:#787878}
  .pr-status{flex:0 0 120px;display:flex;justify-content:center}
  .status-dot{width:12px;height:12px;border-radius:50%}
  .pr-pnl{flex:1;text-align:right;font-weight:700;font-size:15px}
  .pr-chevron{
    flex:0 0 20px;text-align:right;color:#787878;
    transition:transform .15s ease;
  }
  .position-row.expanded .pr-chevron{transform:rotate(180deg)}
  .pr-expand{border-bottom:1px solid #1e1e1e}
  .pr-expand:last-child{border-bottom:none}
  .price-up{color:#2ecc71}
  .price-down{color:#ff4d4f}

  /* ---------- strategy leg table (expand panel) ---------- */
  .leg-table{width:100%;border-collapse:collapse;min-width:760px}
  .leg-table th{
    text-align:right;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
    color:#787878;padding:10px 14px;border-bottom:1px solid #262626;white-space:nowrap;
  }
  .leg-table th:first-child{text-align:left}
  .leg-table th.col-tradetype,.leg-table th.col-status{text-align:center}
  .leg-table td{
    padding:10px 14px;font-size:13px;text-align:right;border-bottom:1px solid #1e1e1e;
    font-variant-numeric:tabular-nums;color:#eeeeee;white-space:nowrap;
  }
  .leg-table tbody tr:hover td{background:#1c1c1c}
  .leg-table td:first-child{text-align:left;font-weight:700}
  .leg-table td.col-tradetype,.leg-table td.col-status{text-align:center}
  .trade-type-pill{
    display:inline-flex;align-items:center;justify-content:center;min-width:52px;
    padding:4px 10px;border-radius:6px;font-size:12px;font-weight:700;color:#ffffff;
  }
  .trade-type-pill.buy{background:#2ecc71}
  .trade-type-pill.sell{background:#ff4d4f}
  .leg-status-dot{width:10px;height:10px;border-radius:50%;display:inline-block}
  .leg-table tfoot td{
    padding:12px 14px;font-size:12.5px;border-top:1px solid #262626;border-bottom:none;
    color:#787878;font-weight:600;
  }
  .leg-table tfoot td:first-child{color:#eeeeee;font-weight:700;text-align:left}
  .trade-pnl-label{font-weight:700;color:#eeeeee;margin-right:6px}
  .trade-pnl-value{font-weight:700}

  .leg-footer-bar{
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:14px 20px;flex-wrap:wrap;
  }
  .leg-footer-left{display:flex;align-items:center;gap:16px;font-size:12px}
  .leg-delete-btn{
    border:none;background:transparent;color:#ff4d4f;cursor:pointer;font-size:15px;
    display:inline-flex;align-items:center;justify-content:center;padding:5px;border-radius:6px;
    transition:background .15s ease;
  }
  .leg-delete-btn:hover{background:rgba(255,77,79,.15)}
  .leg-meta-created{color:#4a90ff;font-weight:600}
  .leg-meta-modified{color:#2ecc71;font-weight:600}
  .analyze-trade-btn{
    padding:9px 16px;border-radius:8px;background:#0d0d0d;color:#ffffff;font-size:12px;font-weight:700;
    letter-spacing:.03em;text-transform:uppercase;border:1px solid #262626;cursor:pointer;font-family:inherit;
    transition:background .15s ease;
  }
  .analyze-trade-btn:hover{background:#1c1c1c}

  /* ---------- add-strategy modal ---------- */
  .modal-overlay{
    position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.6);
    display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .modal-overlay[hidden]{display:none}
  .modal-box{
    background:#161616;border:1px solid #262626;border-radius:12px;
    width:100%;max-width:440px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.5);
  }
  .modal-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px}
  .modal-heading{font-size:18px;font-weight:700}
  .modal-close-btn{
    border:none;background:transparent;color:#787878;font-size:20px;line-height:1;
    cursor:pointer;padding:2px 4px;border-radius:6px;transition:background .15s ease,color .15s ease;
  }
  .modal-close-btn:hover{background:#262626;color:#eeeeee}
  .modal-field{margin-bottom:16px}
  .modal-label{
    display:block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
    color:#787878;margin-bottom:8px;
  }
  .modal-input{
    width:100%;background:#111111;border:1px solid #262626;color:#eeeeee;
    font-family:inherit;font-size:14px;font-weight:600;padding:10px 14px;border-radius:8px;
  }
  .modal-input::placeholder{color:#787878;font-weight:500}
  .modal-input:focus{outline:none;border-color:#4a4a4a}

  .image-dropzone{
    border:1.5px dashed #333333;border-radius:10px;padding:28px 16px;text-align:center;
    cursor:pointer;transition:border-color .15s ease,background .15s ease;
  }
  .image-dropzone:hover,.image-dropzone.dragover{border-color:#4a90ff;background:rgba(74,144,255,.06)}
  .image-dropzone .dz-text{font-size:13px;font-weight:600;color:#c2c2c2}
  .image-dropzone .dz-browse{color:#4a90ff;font-weight:700;text-decoration:underline}
  .image-dropzone .dz-hint{font-size:12px;color:#787878;margin-top:6px}

  .image-preview{position:relative;border-radius:10px;overflow:hidden;border:1px solid #262626}
  .image-preview[hidden]{display:none}
  .image-preview img{display:block;width:100%;max-height:220px;object-fit:contain;background:#0d0d0d}
  .image-remove-btn{
    position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:999px;
    background:rgba(0,0,0,.65);color:#ffffff;border:none;cursor:pointer;font-size:14px;line-height:1;
    display:inline-flex;align-items:center;justify-content:center;transition:background .15s ease;
  }
  .image-remove-btn:hover{background:rgba(255,77,79,.85)}

  .modal-actions{display:flex;align-items:center;justify-content:space-between;margin-top:24px}
  .modal-actions-right{display:flex;gap:10px}
  .modal-btn{
    padding:9px 18px;border-radius:8px;font-size:13px;font-weight:700;font-family:inherit;
    cursor:pointer;border:1px solid #262626;background:#1c1c1c;color:#eeeeee;
    transition:background .15s ease;
  }
  .modal-btn:hover{background:#262626}
  .modal-btn-primary{background:#2ecc71;color:#0d1f14;border-color:transparent}
  .modal-btn-primary:hover{background:#3ee082}
  .modal-btn:disabled{opacity:.5;cursor:not-allowed}
  .modal-box.wide{max-width:720px}

  .modal-error{
    background:rgba(255,77,79,.1);border:1px solid rgba(255,77,79,.3);color:#ff8a8a;
    font-size:12.5px;font-weight:600;padding:10px 14px;border-radius:8px;margin-bottom:16px;
  }
  .modal-error[hidden]{display:none}

  .review-subheading{font-size:12.5px;color:#787878;margin-bottom:14px}
  .leg-edit-table{width:100%;border-collapse:collapse;margin-bottom:12px}
  .leg-edit-table th{
    text-align:left;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
    color:#787878;padding:0 8px 8px;
  }
  .leg-edit-table td{padding:0 8px 10px;vertical-align:middle}
  .leg-edit-table .modal-input{padding:8px 10px;font-size:13px}
  .leg-remove-row-btn{
    border:none;background:transparent;color:#787878;cursor:pointer;font-size:16px;line-height:1;
    padding:6px;border-radius:6px;transition:background .15s ease,color .15s ease;
  }
  .leg-remove-row-btn:hover{background:rgba(255,77,79,.15);color:#ff4d4f}
  .add-leg-row-btn{
    background:transparent;border:1px dashed #333333;color:#c2c2c2;font-family:inherit;
    font-size:12.5px;font-weight:700;padding:8px 14px;border-radius:8px;cursor:pointer;width:100%;
    transition:border-color .15s ease,background .15s ease;
  }
  .add-leg-row-btn:hover{border-color:#4a90ff;background:rgba(74,144,255,.06)}
</style>
</head>
<body>

<header class="navbar">
  <div class="wrap">
    <nav class="nav-links">
      <a href="trading.html">Arbitrage</a>
      <a href="top-losers.html" class="down">Top Losers</a>
      <a href="top-gainers.html" class="up">Top Gainers</a>
      <a href="hiv-stocks.html">High IV</a>
      <a href="watchlist.html">Watchlist</a>
      <a href="positions.html" class="active">Positions</a>
    </nav>
    <a href="/api/fyers/login" class="connect-btn" id="connectBtn">Connect Broker</a>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="positions-toolbar">
      <button type="button" class="add-strategy-btn" id="addStrategyBtn">+ Add Strategy</button>
    </div>
    <div class="grid-card" id="positionsGrid"></div>
  </div>
</main>

<!-- What happens with the name/image beyond capturing them here (persistence,
     rendering into the grid, etc.) is deliberately not built yet -- the full
     strategy builder/tracker is later work. -->
<div class="modal-overlay" id="strategyModalOverlay" hidden>
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="strategyModalHeading">
    <div class="modal-header">
      <div class="modal-heading" id="strategyModalHeading">Add Strategy</div>
      <button type="button" class="modal-close-btn" id="strategyCloseBtn" aria-label="Close">&times;</button>
    </div>

    <div class="modal-error" id="modalError" hidden></div>

    <div id="modalStepForm">
      <div class="modal-field">
        <label class="modal-label" for="strategyNameInput">Strategy Name</label>
        <input type="text" class="modal-input" id="strategyNameInput" placeholder="e.g. Iron Condor" autocomplete="off">
      </div>
      <div class="modal-field">
        <label class="modal-label">Image</label>
        <div class="image-dropzone" id="imageDropzone">
          <div class="dz-text">Drag &amp; drop, paste, or <span class="dz-browse">browse</span> to upload</div>
          <div class="dz-hint">One image only — PNG, JPG, or a pasted screenshot</div>
        </div>
        <div class="image-preview" id="imagePreview" hidden>
          <img id="imagePreviewImg" alt="Strategy image preview">
          <button type="button" class="image-remove-btn" id="imageRemoveBtn" aria-label="Remove image">&times;</button>
        </div>
        <input type="file" accept="image/*" id="imageFileInput" hidden>
      </div>
    </div>

    <div id="modalStepReview" hidden>
      <div class="review-subheading">Check the extracted legs below before adding — fix anything the image reader got wrong.</div>
      <table class="leg-edit-table">
        <thead>
          <tr><th>Ticker</th><th>Trade Type</th><th>Qty</th><th>Entry Price</th><th></th></tr>
        </thead>
        <tbody id="reviewLegsBody"></tbody>
      </table>
      <button type="button" class="add-leg-row-btn" id="addLegRowBtn">+ Add Leg</button>
    </div>

    <div class="modal-actions">
      <button type="button" class="modal-btn" id="strategyResetBtn">Reset</button>
      <button type="button" class="modal-btn" id="reviewBackBtn" hidden>Back</button>
      <div class="modal-actions-right">
        <button type="button" class="modal-btn" id="strategyCancelBtn">Cancel</button>
        <button type="button" class="modal-btn modal-btn-primary" id="strategyAddBtn">Extract Legs</button>
      </div>
    </div>
  </div>
</div>

<script>
  var connectBtn = document.getElementById('connectBtn');
  function markBrokerConnected(){
    if (connectBtn.classList.contains('connected')) return;
    connectBtn.setAttribute('href', '/api/fyers/logout');
    connectBtn.classList.add('connected');
    connectBtn.textContent = 'Disconnect';
  }
  function markBrokerDisconnected(){
    connectBtn.setAttribute('href', '/api/fyers/login');
    connectBtn.classList.remove('connected');
    connectBtn.textContent = 'Connect Broker';
  }
  fetch('/api/fyers/status').then(function(res){ return res.json(); }).then(function(body){
    if (body && body.loggedIn) markBrokerConnected();
  }).catch(function(){});
  connectBtn.addEventListener('click', function(e){
    if (!connectBtn.classList.contains('connected')) return;
    e.preventDefault();
    fetch('/api/fyers/logout').catch(function(){}).then(function(){ markBrokerDisconnected(); });
  });

  // Sample rows only -- there's no real strategy data model, screenshot
  // parsing, or live leg pricing yet (that's later work). Each strategy now
  // carries a legs[] array (the structure this phase is about) alongside
  // the summary fields the top-level row already showed.
  var SAMPLE_POSITIONS = [
    {
      symbol: 'HDFCBANK', date: '10-Aug-2026 10:04', ltp: 742.85, chp: 0.24, statusColor: '#ff6b6b', pnl: 9113.00,
      createdAt: '10-Aug-2026 10:04', modifiedAt: '21-Aug-2026 11:32',
      greeks: { delta: 0, theta: 0, gamma: 0, vega: 0 },
      legs: [
        { ticker: 'HDFCBANK 29SEP2026 780CE', tradeType: 'Sell', qty: -650, entryPrice: 12.23, currentPrice: 0.9, exitPrice: 5.7, pnl: 4244.50, statusColor: '#ff6b6b' },
        { ticker: 'HDFCBANK 29SEP2026 780PE', tradeType: 'Sell', qty: -650, entryPrice: 52, currentPrice: 38.9, exitPrice: 47.05, pnl: 3217.50, statusColor: '#ff6b6b' },
        { ticker: 'HDFCBANK 29SEP2026 720PE', tradeType: 'Buy', qty: 650, entryPrice: 17.4, currentPrice: 2.05, exitPrice: 10.4, pnl: -4550.00, statusColor: '#ff6b6b' },
        { ticker: 'HDFCBANK 29SEP2026 680PE', tradeType: 'Sell', qty: -1950, entryPrice: 5.78, currentPrice: 0.4, exitPrice: 2.6, pnl: 6201.00, statusColor: '#ff6b6b' },
      ],
    },
    {
      symbol: 'RELIANCE', date: '08-Aug-2026 14:22', ltp: 1451.85, chp: -1.12, statusColor: '#2ecc71', pnl: -3245.50,
      createdAt: '08-Aug-2026 14:22', modifiedAt: '08-Aug-2026 14:22',
      greeks: { delta: 0, theta: 0, gamma: 0, vega: 0 },
      legs: [
        { ticker: 'RELIANCE 30OCT2026 1500CE', tradeType: 'Sell', qty: -500, entryPrice: 28.5, currentPrice: 34.2, exitPrice: 30.1, pnl: -2850.00, statusColor: '#2ecc71' },
        { ticker: 'RELIANCE 30OCT2026 1400PE', tradeType: 'Buy', qty: 500, entryPrice: 22.1, currentPrice: 20.8, exitPrice: 21.5, pnl: -395.50, statusColor: '#2ecc71' },
      ],
    },
  ];

  var grid = document.getElementById('positionsGrid');

  function fmtNum(value){
    if (value === null || value === undefined) return '—';
    return value.toLocaleString('en-IN', { maximumFractionDigits: 2 });
  }
  function pctClass(value){
    return value > 0 ? 'price-up' : (value < 0 ? 'price-down' : '');
  }

  function renderPositions(positions){
    if (positions.length === 0) {
      grid.innerHTML = '<div class="empty-state">No strategies yet. Click "+ Add Strategy" to get started.</div>';
      return;
    }
    grid.innerHTML = positions.map(function(p, i){
      return '<div class="position-row" data-index="' + i + '">' +
        '<div class="pr-name">' +
          '<div class="pr-symbol">' + p.symbol + '</div>' +
        '</div>' +
        '<div class="pr-price">' +
          '<span class="pr-ltp">' + (p.ltp !== null && p.ltp !== undefined ? fmtNum(p.ltp) : '—') + '</span>' +
          (p.chp !== null && p.chp !== undefined ?
            '<span class="pr-chg ' + pctClass(p.chp) + '">(' + (p.chp > 0 ? '+' : '') + p.chp.toFixed(2) + '%)</span>' : '') +
        '</div>' +
        '<div class="pr-date">' + p.date + '</div>' +
        '<div class="pr-status"><span class="status-dot" style="background:' + p.statusColor + '"></span></div>' +
        '<div class="pr-pnl ' + pctClass(p.pnl) + '">₹ ' + (p.pnl > 0 ? '+' : '') + fmtNum(p.pnl) + '</div>' +
        '<div class="pr-chevron">⌄</div>' +
        '</div>';
    }).join('');
  }

  function fmtSigned(value){
    return (value > 0 ? '+' : '') + fmtNum(value);
  }

  // Renders a strategy's legs[] as the Ticker/Trade Type/Qty/Entry/Current/
  // Exit/P&L/Status table, plus a Positional Greeks summary row and a
  // footer bar (delete, created/modified timestamps, Analyze Trade). Greeks
  // are placeholder zeros and Analyze Trade has no handler yet -- both are
  // later work (real Greeks need the payoff/analytics engine, not built
  // yet; Analyze Trade's target view isn't built yet either).
  function renderLegTable(strategy, index){
    var legRows = strategy.legs.map(function(leg){
      var pillClass = leg.tradeType === 'Buy' ? 'buy' : 'sell';
      return '<tr>' +
        '<td>' + leg.ticker + '</td>' +
        '<td class="col-tradetype"><span class="trade-type-pill ' + pillClass + '">' + leg.tradeType + '</span></td>' +
        '<td>' + fmtNum(leg.qty) + '</td>' +
        '<td>' + fmtNum(leg.entryPrice) + '</td>' +
        '<td>' + fmtNum(leg.currentPrice) + '</td>' +
        '<td>' + fmtNum(leg.exitPrice) + '</td>' +
        '<td class="' + pctClass(leg.pnl) + '">' + fmtSigned(leg.pnl) + '</td>' +
        '<td class="col-status"><span class="leg-status-dot" style="background:' + leg.statusColor + '"></span></td>' +
        '</tr>';
    }).join('');

    var tradePnl = strategy.legs.reduce(function(sum, leg){ return sum + leg.pnl; }, 0);
    var greeks = strategy.greeks;

    return '' +
      '<div class="leg-table-scroll" style="overflow:auto">' +
      '<table class="leg-table">' +
        '<thead><tr>' +
          '<th>Ticker</th><th class="col-tradetype">Trade Type</th><th>Qty</th>' +
          '<th>Entry Price</th><th>Current Price</th><th>Exit Price</th><th>P&amp;L</th>' +
          '<th class="col-status">Status</th>' +
        '</tr></thead>' +
        '<tbody>' + legRows + '</tbody>' +
        '<tfoot><tr>' +
          '<td colspan="2">Positional Greeks</td>' +
          '<td>Delta: ' + greeks.delta.toFixed(2) + '</td>' +
          '<td>Theta: ' + greeks.theta.toFixed(2) + '</td>' +
          '<td>Gamma: ' + greeks.gamma.toFixed(2) + '</td>' +
          '<td>Vega: ' + greeks.vega.toFixed(2) + '</td>' +
          '<td><span class="trade-pnl-label">Trade P&amp;L</span><span class="trade-pnl-value ' + pctClass(tradePnl) + '">₹ ' + fmtSigned(tradePnl) + '</span></td>' +
          '<td></td>' +
        '</tr></tfoot>' +
      '</table>' +
      '</div>' +
      '<div class="leg-footer-bar">' +
        '<div class="leg-footer-left">' +
          '<button type="button" class="leg-delete-btn" data-index="' + index + '" aria-label="Delete strategy">🗑</button>' +
          '<span class="leg-meta-created">Created At: ' + strategy.createdAt + '</span>' +
          '<span class="leg-meta-modified">Modified At: ' + strategy.modifiedAt + '</span>' +
        '</div>' +
        '<button type="button" class="analyze-trade-btn">Analyze Trade</button>' +
      '</div>';
  }

  // Chevron toggles the leg table for that strategy. Delete removes the
  // whole strategy (event-delegated since the expand panel is created
  // dynamically as a sibling of its row, not a descendant).
  grid.addEventListener('click', function(e){
    var deleteBtn = e.target.closest('.leg-delete-btn');
    if (deleteBtn) {
      SAMPLE_POSITIONS.splice(Number(deleteBtn.getAttribute('data-index')), 1);
      renderPositions(SAMPLE_POSITIONS);
      return;
    }

    var row = e.target.closest('.position-row');
    if (!row) return;
    var existing = row.nextElementSibling;
    if (existing && existing.classList.contains('pr-expand')) {
      existing.remove();
      row.classList.remove('expanded');
      return;
    }
    document.querySelectorAll('.pr-expand').forEach(function(el){ el.remove(); });
    document.querySelectorAll('.position-row.expanded').forEach(function(el){ el.classList.remove('expanded'); });
    var index = Number(row.getAttribute('data-index'));
    var expand = document.createElement('div');
    expand.className = 'pr-expand';
    expand.innerHTML = renderLegTable(SAMPLE_POSITIONS[index], index);
    row.after(expand);
    row.classList.add('expanded');
  });

  renderPositions(SAMPLE_POSITIONS);

  // ---------- Add Strategy modal ----------
  var addStrategyBtn = document.getElementById('addStrategyBtn');
  var modalOverlay = document.getElementById('strategyModalOverlay');
  var modalBox = document.querySelector('.modal-box');
  var modalError = document.getElementById('modalError');
  var modalStepForm = document.getElementById('modalStepForm');
  var modalStepReview = document.getElementById('modalStepReview');
  var strategyNameInput = document.getElementById('strategyNameInput');
  var imageDropzone = document.getElementById('imageDropzone');
  var imagePreview = document.getElementById('imagePreview');
  var imagePreviewImg = document.getElementById('imagePreviewImg');
  var imageRemoveBtn = document.getElementById('imageRemoveBtn');
  var imageFileInput = document.getElementById('imageFileInput');
  var strategyResetBtn = document.getElementById('strategyResetBtn');
  var reviewBackBtn = document.getElementById('reviewBackBtn');
  var strategyCancelBtn = document.getElementById('strategyCancelBtn');
  var strategyCloseBtn = document.getElementById('strategyCloseBtn');
  var strategyAddBtn = document.getElementById('strategyAddBtn');
  var reviewLegsBody = document.getElementById('reviewLegsBody');
  var addLegRowBtn = document.getElementById('addLegRowBtn');

  var selectedImageFile = null; // only one at a time -- a new pick/drop/paste always replaces it
  var modalStep = 'form';       // 'form' | 'review'
  var reviewLegs = [];          // editable working copy of the extracted (or manually added) legs
  var reviewUnderlying = null;

  function resetStrategyForm(){
    strategyNameInput.value = '';
    selectedImageFile = null;
    imageFileInput.value = '';
    imagePreviewImg.src = '';
    imagePreview.hidden = true;
    imageDropzone.hidden = false;
    reviewLegs = [];
    reviewUnderlying = null;
  }

  function showModalError(message){
    modalError.textContent = message;
    modalError.hidden = false;
  }
  function hideModalError(){
    modalError.hidden = true;
  }

  function setModalStep(step){
    modalStep = step;
    modalStepForm.hidden = step !== 'form';
    modalStepReview.hidden = step !== 'review';
    strategyResetBtn.hidden = step !== 'form';
    reviewBackBtn.hidden = step !== 'review';
    strategyAddBtn.textContent = step === 'review' ? 'Confirm & Add' : 'Extract Legs';
    modalBox.classList.toggle('wide', step === 'review');
    hideModalError();
  }

  function setStrategyImage(file){
    if (!file || file.type.indexOf('image/') !== 0) return;
    selectedImageFile = file;
    var reader = new FileReader();
    reader.onload = function(){
      imagePreviewImg.src = reader.result;
      imagePreview.hidden = false;
      imageDropzone.hidden = true;
    };
    reader.readAsDataURL(file);
  }

  function handleModalPaste(e){
    if (modalStep !== 'form') return;
    var items = (e.clipboardData && e.clipboardData.items) || [];
    for (var i = 0; i < items.length; i++) {
      if (items[i].type.indexOf('image/') === 0) {
        setStrategyImage(items[i].getAsFile());
        e.preventDefault();
        break;
      }
    }
  }

  function openStrategyModal(){
    resetStrategyForm();
    setModalStep('form');
    modalOverlay.hidden = false;
    document.addEventListener('paste', handleModalPaste);
  }
  function closeStrategyModal(){
    modalOverlay.hidden = true;
    document.removeEventListener('paste', handleModalPaste);
  }

  addStrategyBtn.addEventListener('click', openStrategyModal);
  strategyCancelBtn.addEventListener('click', closeStrategyModal);
  strategyCloseBtn.addEventListener('click', closeStrategyModal);
  strategyResetBtn.addEventListener('click', resetStrategyForm);
  reviewBackBtn.addEventListener('click', function(){ setModalStep('form'); });
  modalOverlay.addEventListener('click', function(e){
    if (e.target === modalOverlay) closeStrategyModal();
  });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && !modalOverlay.hidden) closeStrategyModal();
  });

  imageDropzone.addEventListener('click', function(){ imageFileInput.click(); });
  imageFileInput.addEventListener('change', function(){
    if (imageFileInput.files && imageFileInput.files[0]) setStrategyImage(imageFileInput.files[0]);
  });
  imageDropzone.addEventListener('dragover', function(e){
    e.preventDefault();
    imageDropzone.classList.add('dragover');
  });
  imageDropzone.addEventListener('dragleave', function(){
    imageDropzone.classList.remove('dragover');
  });
  imageDropzone.addEventListener('drop', function(e){
    e.preventDefault();
    imageDropzone.classList.remove('dragover');
    var file = e.dataTransfer.files && e.dataTransfer.files[0];
    if (file) setStrategyImage(file);
  });
  imageRemoveBtn.addEventListener('click', function(e){
    e.stopPropagation();
    selectedImageFile = null;
    imageFileInput.value = '';
    imagePreview.hidden = true;
    imageDropzone.hidden = false;
  });

  // ---------- Review step: editable leg table ----------
  function renderReviewLegs(){
    if (reviewLegs.length === 0) {
      reviewLegsBody.innerHTML = '<tr><td colspan="5" style="color:#787878;font-size:13px;padding:8px">No legs yet -- click "+ Add Leg" to enter one manually.</td></tr>';
      return;
    }
    reviewLegsBody.innerHTML = reviewLegs.map(function(leg, i){
      return '<tr>' +
        '<td><input type="text" class="modal-input leg-edit-input" data-field="ticker" data-idx="' + i + '" value="' + leg.ticker.replace(/"/g, '&quot;') + '"></td>' +
        '<td><select class="modal-input leg-edit-input" data-field="tradeType" data-idx="' + i + '">' +
          '<option value="Buy"' + (leg.tradeType === 'Buy' ? ' selected' : '') + '>Buy</option>' +
          '<option value="Sell"' + (leg.tradeType === 'Sell' ? ' selected' : '') + '>Sell</option>' +
          '</select></td>' +
        '<td><input type="number" class="modal-input leg-edit-input" data-field="qty" data-idx="' + i + '" value="' + leg.qty + '"></td>' +
        '<td><input type="number" step="0.01" class="modal-input leg-edit-input" data-field="entryPrice" data-idx="' + i + '" value="' + leg.entryPrice + '"></td>' +
        '<td><button type="button" class="leg-remove-row-btn" data-idx="' + i + '" aria-label="Remove leg">&times;</button></td>' +
        '</tr>';
    }).join('');
  }

  reviewLegsBody.addEventListener('input', function(e){
    var input = e.target.closest('.leg-edit-input');
    if (!input) return;
    var idx = Number(input.getAttribute('data-idx'));
    var field = input.getAttribute('data-field');
    var leg = reviewLegs[idx];
    if (!leg) return;
    if (field === 'qty' || field === 'entryPrice') leg[field] = Number(input.value);
    else leg[field] = input.value;
  });
  reviewLegsBody.addEventListener('click', function(e){
    var btn = e.target.closest('.leg-remove-row-btn');
    if (!btn) return;
    reviewLegs.splice(Number(btn.getAttribute('data-idx')), 1);
    renderReviewLegs();
  });
  addLegRowBtn.addEventListener('click', function(){
    reviewLegs.push({ ticker: '', tradeType: 'Buy', qty: 0, entryPrice: 0 });
    renderReviewLegs();
  });

  // ---------- Extraction + confirm ----------
  var MONTH_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function formatDateTime(d){
    var day = String(d.getDate()).padStart(2, '0');
    var hh = String(d.getHours()).padStart(2, '0');
    var mm = String(d.getMinutes()).padStart(2, '0');
    return day + '-' + MONTH_NAMES[d.getMonth()] + '-' + d.getFullYear() + ' ' + hh + ':' + mm;
  }

  function extractLegsFromImage(){
    if (!selectedImageFile) {
      // No image to read -- skip straight to an empty review step so legs
      // can still be entered by hand via "+ Add Leg".
      reviewLegs = [];
      reviewUnderlying = null;
      renderReviewLegs();
      setModalStep('review');
      return;
    }
    hideModalError();
    strategyAddBtn.disabled = true;
    strategyAddBtn.textContent = 'Extracting…';

    var reader = new FileReader();
    reader.onload = function(){
      fetch('/api/strategy/parse-legs', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ image: reader.result }),
      })
        .then(function(res){ return res.json().then(function(body){ return { ok: res.ok, body: body }; }); })
        .then(function(result){
          strategyAddBtn.disabled = false;
          if (!result.ok || result.body.status !== 'ok') {
            throw new Error((result.body && result.body.message) || 'Could not read that image.');
          }
          reviewLegs = result.body.legs.map(function(leg){
            return { ticker: leg.ticker || '', tradeType: leg.tradeType === 'Sell' ? 'Sell' : 'Buy', qty: Number(leg.qty) || 0, entryPrice: Number(leg.entryPrice) || 0 };
          });
          reviewUnderlying = result.body.underlying || null;
          renderReviewLegs();
          setModalStep('review');
        })
        .catch(function(err){
          strategyAddBtn.disabled = false;
          strategyAddBtn.textContent = 'Extract Legs';
          showModalError(err.message || 'Could not read that image. Try a clearer screenshot, or add legs manually.');
        });
    };
    reader.readAsDataURL(selectedImageFile);
  }

  // Best-effort: if the extracted underlying is a symbol this app already
  // tracks quotes for, pull its live LTP/% change in after the strategy is
  // added. Silent no-op otherwise -- this phase is about getting legs
  // structured, not live pricing.
  function fetchUnderlyingQuoteAndUpdate(strategy){
    fetch('/api/fyers/quotes')
      .then(function(res){ return res.json(); })
      .then(function(body){
        var q = body && body.quotes && body.quotes[strategy.symbol];
        if (!q || q.ltp === null || q.ltp === undefined) return;
        strategy.ltp = q.ltp;
        strategy.chp = q.chp !== undefined ? q.chp : null;
        renderPositions(SAMPLE_POSITIONS);
      })
      .catch(function(){});
  }

  function confirmAddStrategy(){
    if (reviewLegs.length === 0) {
      showModalError('Add at least one leg before confirming.');
      return;
    }
    for (var i = 0; i < reviewLegs.length; i++) {
      if (!reviewLegs[i].ticker.trim()) {
        showModalError('Every leg needs a ticker.');
        return;
      }
    }

    var now = new Date();
    var dateStr = formatDateTime(now);
    var legs = reviewLegs.map(function(leg){
      // Fresh legs have no live current/exit price yet (that's a later
      // phase) -- default current to entry so P&L starts at 0 rather than
      // showing a misleading number.
      return {
        ticker: leg.ticker.trim(), tradeType: leg.tradeType, qty: leg.qty, entryPrice: leg.entryPrice,
        currentPrice: leg.entryPrice, exitPrice: null, pnl: 0, statusColor: '#888888',
      };
    });

    var strategy = {
      symbol: reviewUnderlying || strategyNameInput.value.trim() || 'Strategy',
      date: dateStr, ltp: null, chp: null, statusColor: '#888888', pnl: 0,
      createdAt: dateStr, modifiedAt: dateStr,
      greeks: { delta: 0, theta: 0, gamma: 0, vega: 0 },
      legs: legs,
    };

    SAMPLE_POSITIONS.unshift(strategy);
    renderPositions(SAMPLE_POSITIONS);
    closeStrategyModal();
    if (reviewUnderlying) fetchUnderlyingQuoteAndUpdate(strategy);
  }

  strategyAddBtn.addEventListener('click', function(){
    if (modalStep === 'form') extractLegsFromImage();
    else confirmAddStrategy();
  });
</script>
</body>
</html>
