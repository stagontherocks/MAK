<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watchlist — GrabMyStone</title>
<link rel="icon" href="images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:#111111;color:#eeeeee;
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
  }
  .wrap{max-width:1240px;margin:0 auto;padding:0 24px}

  .navbar{
    position:sticky;top:0;z-index:100;
    background:#111111;border-bottom:1px solid #262626;
  }
  .navbar .wrap{
    height:58px;display:flex;align-items:center;justify-content:space-between;gap:24px;
  }
  .nav-links{display:flex;align-items:center;gap:8px}
  .nav-links a{
    padding:10px 16px;border-radius:999px;font-weight:600;font-size:13px;
    color:#c2c2c2;text-decoration:none;transition:background .15s ease,color .15s ease;
  }
  .nav-links a:hover{background:#1c1c1c;color:#ffffff}
  .nav-links a.up{color:#2ecc71}
  .nav-links a.up:hover{background:rgba(46,204,113,.12)}
  .nav-links a.down{color:#ff4d4f}
  .nav-links a.down:hover{background:rgba(255,77,79,.12)}
  .nav-links a.active{background:#1c1c1c;color:#ffffff}
  .nav-links a.down.active{background:rgba(255,77,79,.15);color:#ff4d4f}
  .nav-links a.up.active{background:rgba(46,204,113,.15);color:#2ecc71}

  .connect-btn{
    display:inline-flex;align-items:center;padding:9px 16px;border-radius:8px;
    background:#2ecc71;color:#0d1f14;font-size:13px;font-weight:700;text-decoration:none;
    transition:background .15s ease;
  }
  .connect-btn:hover{background:#3ee082}
  .connect-btn.connected{background:#1c1c1c;color:#ff4d4f;border:1px solid #262626}
  .connect-btn.connected:hover{background:rgba(255,77,79,.12)}

  main{padding:20px 0}

  .grid-toolbar{margin-bottom:16px}
  .search-wrap{position:relative;width:280px}
  .search-input{
    background:#161616 url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%23787878" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>') no-repeat 14px center/14px;
    border:1px solid #262626;color:#eeeeee;
    font-family:inherit;font-size:13px;font-weight:600;
    padding:9px 16px 9px 38px;border-radius:8px;
    width:100%;
  }
  .search-input::placeholder{color:#787878;font-weight:500}
  .search-input:hover{border-color:#3a3a3a}
  .search-input:focus{outline:none;border-color:#4a4a4a}
  .search-suggestions{
    position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:10;
    background:#1a1a1a;border:1px solid #262626;border-radius:8px;overflow:hidden;
    box-shadow:0 8px 24px rgba(0,0,0,.4);
  }
  .search-suggestions[hidden]{display:none}
  .suggestion{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:10px 14px;font-size:13px;font-weight:600;color:#eeeeee;cursor:pointer;
  }
  .suggestion:hover,.suggestion.highlighted{background:#262626}
  .suggestion .lot{color:#787878;font-weight:500;font-size:12px}

  .grid-card{
    background:#161616;border:1px solid #262626;border-radius:10px;overflow:hidden;
  }
  .grid-scroll{overflow:auto;max-height:calc(100vh - 220px)}
  .grid-scroll,.chain-scroll{scrollbar-width:none;-ms-overflow-style:none}
  .grid-scroll::-webkit-scrollbar,.chain-scroll::-webkit-scrollbar{display:none}
  table{width:100%;border-collapse:collapse;min-width:560px}
  thead th{
    position:sticky;top:0;z-index:1;
    background:#1a1a1a;
    text-align:right;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
    color:#787878;padding:12px 16px;border-bottom:1px solid #262626;white-space:nowrap;
  }
  thead th:first-child{text-align:left}
  thead th:last-child{width:44px}
  tbody td{
    padding:12px 16px;font-size:13px;text-align:right;border-bottom:1px solid #1e1e1e;
    font-variant-numeric:tabular-nums;color:#eeeeee;white-space:nowrap;
  }
  tbody td:first-child{text-align:left;font-weight:700}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover td{background:#1c1c1c}
  tbody tr{cursor:pointer}
  tbody tr.row-selected td{background:#1c1c1c}
  tbody tr.row-selected td:first-child{box-shadow:inset 3px 0 0 #4a90ff}
  .price-up{color:#2ecc71}
  .price-down{color:#ff4d4f}
  .remove-btn{
    opacity:0;border:none;background:#262626;color:#c2c2c2;width:24px;height:24px;
    border-radius:999px;cursor:pointer;font-size:14px;line-height:1;
    display:inline-flex;align-items:center;justify-content:center;
    transition:opacity .1s ease,background .15s ease,color .15s ease;
  }
  tbody tr:hover .remove-btn{opacity:1}
  .remove-btn:hover{background:rgba(255,77,79,.2);color:#ff4d4f}
  .empty-state{padding:48px 16px;text-align:center;color:#787878;font-size:13px;font-weight:600}

  /* ---------- two-column layout ---------- */
  .wl-columns{display:flex;align-items:flex-start;gap:20px}
  .wl-left{flex:0 0 400px;min-width:0}
  .wl-right{flex:1 1 auto;min-width:0}
  /* the left column is narrower than the original single-column layout this
     table was designed for -- drop the wide min-width and tighten padding
     so 4 columns + remove button fit without forcing horizontal scroll */
  .wl-left .search-wrap{width:100%}
  .wl-left table{min-width:0}
  .wl-left thead th{padding:12px 10px}
  .wl-left tbody td{padding:12px 10px;font-size:12.5px}

  /* ---------- option-chain panel ---------- */
  .chain-panel{
    background:#161616;border:1px solid #262626;border-radius:10px;overflow:hidden;
    min-height:400px;
  }
  .chain-empty{padding:48px 16px;text-align:center;color:#787878;font-size:13px;font-weight:600}

  .chain-topstrip{
    display:flex;align-items:center;gap:16px;padding:14px 18px;border-bottom:1px solid #262626;
    flex-wrap:wrap;
  }
  .ts-item{display:flex;align-items:baseline;gap:8px}
  .ts-label{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#787878}
  .ts-value{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
  .ts-sep{width:1px;height:16px;background:#262626}

  .chain-expiries{
    display:flex;align-items:center;gap:8px;padding:12px 18px;border-bottom:1px solid #262626;
    position:relative;
  }
  .expiry-tab{
    padding:8px 14px;border-radius:8px;border:1px solid #262626;background:#1a1a1a;
    color:#c2c2c2;font-size:12px;font-weight:700;font-family:inherit;cursor:pointer;white-space:nowrap;
  }
  .expiry-tab:hover{border-color:#3a3a3a}
  .expiry-tab.active{border-color:#4a90ff;color:#4a90ff;background:rgba(74,144,255,.1)}
  .expiry-more-btn{
    padding:8px 10px;border-radius:8px;border:1px solid #262626;background:#1a1a1a;
    color:#c2c2c2;font-size:12px;cursor:pointer;
  }
  .expiry-more-btn:hover{border-color:#3a3a3a}
  .expiry-dropdown{
    position:absolute;top:calc(100% + 6px);right:18px;z-index:10;
    background:#1a1a1a;border:1px solid #262626;border-radius:8px;overflow:hidden;
    box-shadow:0 8px 24px rgba(0,0,0,.4);min-width:160px;max-height:280px;overflow-y:auto;
  }
  .expiry-dropdown[hidden]{display:none}
  .expiry-option{padding:10px 14px;font-size:13px;font-weight:600;color:#eeeeee;cursor:pointer;white-space:nowrap}
  .expiry-option:hover,.expiry-option.active{background:#262626}

  .chain-scroll{overflow:auto;max-height:calc(100vh - 320px)}
  .chain-table{width:100%;border-collapse:collapse;min-width:640px}
  .chain-table thead th{
    position:sticky;top:0;z-index:1;background:#1a1a1a;
    font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#787878;
    padding:10px 12px;border-bottom:1px solid #262626;white-space:nowrap;text-align:right;
  }
  .chain-table thead th.col-strike{text-align:center}
  .chain-table tbody td{
    padding:9px 12px;font-size:13px;text-align:right;border-bottom:1px solid #1e1e1e;
    font-variant-numeric:tabular-nums;color:#eeeeee;white-space:nowrap;position:relative;
  }
  .chain-table tbody tr:last-child td{border-bottom:none}
  .cell-strike{
    text-align:center !important;font-weight:700;background:#1a1a1a;
    border-left:1px solid #262626;border-right:1px solid #262626;
  }
  .chain-table tbody tr.atm-row .cell-strike{background:rgba(74,144,255,.18);color:#4a90ff}
  .chain-table tbody tr.atm-row td{background-color:rgba(74,144,255,.06)}
  .cell-itm{background-color:rgba(255,214,64,.08)}
  .cell-oi{overflow:hidden}
  .cell-oi-call{background-image:linear-gradient(to left, rgba(46,204,113,.25) var(--pct,0%), transparent var(--pct,0%))}
  .cell-oi-put{background-image:linear-gradient(to right, rgba(255,77,79,.25) var(--pct,0%), transparent var(--pct,0%))}
  .delta-call{color:#2ecc71}
  .delta-put{color:#ff4d4f}

  @media (max-width:1000px){
    .wl-columns{flex-direction:column}
    .wl-left{flex-basis:auto;width:100%}
    .wl-right{width:100%}
  }

  /* ---------- fit-to-screen desktop layout ----------
     Below 1000px the panels stack and the page scrolls normally (rule
     block above). At desktop widths, instead fit both panels to the
     viewport with a 20px gap and no outer page scroll -- only each
     panel's own internal list/table scrolls. */
  @media (min-width:1000.01px){
    html,body{height:100%}
    body{height:100vh;overflow:hidden;display:flex;flex-direction:column}
    .navbar{flex:0 0 auto}
    main{flex:1 1 auto;min-height:0;display:flex}
    main .wrap{flex:1;display:flex;flex-direction:column;min-height:0}
    .wl-columns{flex:1;min-height:0;align-items:stretch}
    .wl-left{display:flex;flex-direction:column;min-height:0}
    .grid-card{display:flex;flex-direction:column;flex:1;min-height:0}
    .grid-scroll{flex:1;min-height:0;max-height:none}
    .wl-right{display:flex;flex-direction:column;min-height:0}
    .chain-panel{display:flex;flex-direction:column;flex:1;min-height:0}
    .chain-empty{flex:1;display:flex;align-items:center;justify-content:center}
    .chain-empty[hidden]{display:none}
    #chainContent{flex:1;display:flex;flex-direction:column;min-height:0}
    #chainContent[hidden]{display:none}
    .chain-scroll{flex:1;min-height:0;max-height:none}
  }
</style>
</head>
<body>

<header class="navbar">
  <div class="wrap">
    <nav class="nav-links">
      <a href="trading.html">Arbitrage</a>
      <a href="top-losers.html" class="down">Top Losers</a>
      <a href="top-gainers.html" class="up">Top Gainers</a>
      <a href="hiv-stocks.html">High IV</a>
      <a href="watchlist.html" class="active">Watchlist</a>
      <a href="positions.html">Positions</a>
    </nav>
    <a href="/api/fyers/login" class="connect-btn" id="connectBtn">Connect Broker</a>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="wl-columns">
      <div class="wl-left">
        <div class="grid-toolbar">
          <div class="search-wrap">
            <input type="text" class="search-input" id="stockSearch" placeholder="Search stock to add..." aria-label="Search stock to add" autocomplete="off">
            <div class="search-suggestions" id="searchSuggestions" hidden></div>
          </div>
        </div>
        <div class="grid-card">
          <div class="grid-scroll">
            <table>
              <thead>
                <tr>
                  <th>Stock Name</th>
                  <th>LTP</th>
                  <th>Change</th>
                  <th>% Change</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="gridBody"></tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="wl-right">
        <div class="chain-panel" id="chainPanel">
          <div class="chain-empty" id="chainEmpty">Select a stock from your watchlist to view its option chain.</div>
          <div id="chainContent" hidden>
            <div class="chain-topstrip">
              <div class="ts-item"><span class="ts-label">Spot</span><span class="ts-value" id="tsSpot">—</span></div>
              <div class="ts-sep"></div>
              <div class="ts-item"><span class="ts-label">VIX</span><span class="ts-value" id="tsVix">—</span></div>
              <div class="ts-sep"></div>
              <div class="ts-item"><span class="ts-label">Fut</span><span class="ts-value" id="tsFut">—</span></div>
            </div>
            <div class="chain-expiries" id="chainExpiries">
              <div id="expiryTabs" style="display:flex;gap:8px;flex-wrap:wrap;flex:1"></div>
              <button type="button" class="expiry-more-btn" id="expiryMoreBtn">▾</button>
              <div class="expiry-dropdown" id="expiryDropdown" hidden></div>
            </div>
            <div class="chain-scroll">
              <table class="chain-table">
                <thead>
                  <tr>
                    <th class="col-delta">Call Δ</th>
                    <th>LTP</th>
                    <th>OI</th>
                    <th class="col-strike">Strike</th>
                    <th>OI</th>
                    <th>LTP</th>
                    <th class="col-delta">Put Δ</th>
                    <th>Intrinsic</th>
                    <th>Time Value</th>
                  </tr>
                </thead>
                <tbody id="chainBody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<script>
  var connectBtn = document.getElementById('connectBtn');
  function markBrokerConnected(){
    if (connectBtn.classList.contains('connected')) return;
    connectBtn.setAttribute('href', '/api/fyers/logout');
    connectBtn.classList.add('connected');
    connectBtn.textContent = 'Disconnect';
  }
  function markBrokerDisconnected(){
    connectBtn.setAttribute('href', '/api/fyers/login');
    connectBtn.classList.remove('connected');
    connectBtn.textContent = 'Connect Broker';
  }
  fetch('/api/fyers/status').then(function(res){ return res.json(); }).then(function(body){
    if (body && body.loggedIn) markBrokerConnected();
  }).catch(function(){});
  connectBtn.addEventListener('click', function(e){
    if (!connectBtn.classList.contains('connected')) return;
    e.preventDefault();
    fetch('/api/fyers/logout').catch(function(){}).then(function(){ markBrokerDisconnected(); });
  });

  var WATCHLIST_KEY = 'watchlistSymbols_v1';
  var SELECTED_SYMBOL_KEY = 'watchlistSelectedSymbol_v1';
  var gridBody = document.getElementById('gridBody');
  // Same hardcoded MCX list as trading.html (MCX_ROWS there) -- these four
  // have no equity spot instrument, so they're not in fo-stocks.json and
  // need mcx-quotes.js instead of quotes.js for pricing (see pollQuotes).
  var MCX_ROWS = [['CRUDEOIL', 100], ['NATURALGAS', 1250], ['GOLDM', 10], ['SILVERM', 5]];
  var MCX_SYMBOL_SET = new Set(MCX_ROWS.map(function(r){ return r[0]; }));
  var allStocks = []; // [symbol, lot] pairs, F&O + MCX universe -- watchlist is scoped to this same universe as the rest of the app
  var lotBySymbol = {};
  var watchlist = [];  // ordered list of symbols, persisted
  var lastQuotes = {}; // symbol -> {ltp, chp}
  var selectedSymbol = null; // which watchlist row's option chain is showing on the right

  function loadWatchlist(){
    try {
      var raw = localStorage.getItem(WATCHLIST_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (err) { return []; }
  }
  function saveWatchlist(){
    try { localStorage.setItem(WATCHLIST_KEY, JSON.stringify(watchlist)); } catch (err) {}
  }

  function fmtNum(value){
    return value.toLocaleString('en-IN', { maximumFractionDigits: 2 });
  }
  function pctClass(value){
    if (value === null || value === undefined) return '';
    return value > 0 ? 'price-up' : (value < 0 ? 'price-down' : '');
  }

  function renderGrid(){
    if (watchlist.length === 0) {
      gridBody.innerHTML = '';
      var card = document.querySelector('.grid-card');
      if (!document.getElementById('emptyState')) {
        var div = document.createElement('div');
        div.id = 'emptyState';
        div.className = 'empty-state';
        div.textContent = 'Search above to add stocks to your watchlist.';
        card.appendChild(div);
      }
      return;
    }
    var existingEmpty = document.getElementById('emptyState');
    if (existingEmpty) existingEmpty.remove();

    gridBody.innerHTML = watchlist.map(function(symbol){
      var q = lastQuotes[symbol];
      var ltp = q && q.ltp !== null && q.ltp !== undefined ? q.ltp : null;
      var chp = q && q.chp !== null && q.chp !== undefined ? q.chp : null;
      // Fyers gives us ltp + % change directly; derive the absolute rupee
      // change from those two rather than needing a separate field/poll.
      var change = (ltp !== null && chp !== null) ? ltp - ltp / (1 + chp / 100) : null;
      var rowClass = symbol === selectedSymbol ? ' class="row-selected"' : '';
      return '<tr data-symbol="' + symbol + '"' + rowClass + '>' +
        '<td>' + symbol + '</td>' +
        '<td>' + (ltp !== null ? fmtNum(ltp) : '—') + '</td>' +
        '<td class="' + pctClass(change) + '">' + (change !== null ? (change > 0 ? '+' : '') + fmtNum(change) : '—') + '</td>' +
        '<td class="' + pctClass(chp) + '">' + (chp !== null ? (chp > 0 ? '+' : '') + chp.toFixed(2) + '%' : '—') + '</td>' +
        '<td><button type="button" class="remove-btn" data-symbol="' + symbol + '" aria-label="Remove ' + symbol + '">&times;</button></td>' +
        '</tr>';
    }).join('');
  }

  gridBody.addEventListener('click', function(e){
    var btn = e.target.closest('.remove-btn');
    if (btn) {
      var removed = btn.getAttribute('data-symbol');
      watchlist = watchlist.filter(function(s){ return s !== removed; });
      saveWatchlist();
      if (removed === selectedSymbol) selectSymbol(watchlist[0] || null);
      renderGrid();
      return;
    }
    var row = e.target.closest('tr[data-symbol]');
    if (!row) return;
    selectSymbol(row.getAttribute('data-symbol'));
  });

  function addSymbol(symbol){
    if (watchlist.indexOf(symbol) === -1) {
      watchlist.push(symbol);
      saveWatchlist();
    }
    selectSymbol(symbol);
    renderGrid();
  }

  // Typeahead: type to search the F&O universe, click (or Enter) a
  // suggestion to add it. Already-watchlisted symbols are excluded from
  // suggestions since there's nothing more to do with them here.
  var searchInput = document.getElementById('stockSearch');
  var suggestionsEl = document.getElementById('searchSuggestions');
  var currentMatches = [];

  function renderSuggestions(){
    var term = searchInput.value.trim().toUpperCase();
    if (!term) {
      suggestionsEl.hidden = true;
      currentMatches = [];
      return;
    }
    currentMatches = allStocks
      .filter(function(s){ return s[0].indexOf(term) !== -1 && watchlist.indexOf(s[0]) === -1; })
      .slice(0, 8);
    if (currentMatches.length === 0) {
      suggestionsEl.hidden = true;
      return;
    }
    suggestionsEl.innerHTML = currentMatches.map(function(s){
      return '<div class="suggestion" data-symbol="' + s[0] + '">' +
        '<span>' + s[0] + '</span><span class="lot">Lot ' + s[1].toLocaleString('en-IN') + '</span>' +
        '</div>';
    }).join('');
    suggestionsEl.hidden = false;
  }

  searchInput.addEventListener('input', renderSuggestions);
  searchInput.addEventListener('keydown', function(e){
    if (e.key === 'Enter' && currentMatches.length > 0) {
      addSymbol(currentMatches[0][0]);
      searchInput.value = '';
      suggestionsEl.hidden = true;
      currentMatches = [];
    } else if (e.key === 'Escape') {
      suggestionsEl.hidden = true;
    }
  });
  suggestionsEl.addEventListener('click', function(e){
    var row = e.target.closest('.suggestion');
    if (!row) return;
    addSymbol(row.getAttribute('data-symbol'));
    searchInput.value = '';
    suggestionsEl.hidden = true;
    currentMatches = [];
    searchInput.focus();
  });
  document.addEventListener('click', function(e){
    if (!e.target.closest('.search-wrap')) suggestionsEl.hidden = true;
  });

  // Reuses the same /api/fyers/quotes endpoint trading.html polls -- it
  // already covers the full F&O universe every 6s, so no new backend
  // endpoint is needed here, just client-side filtering down to the
  // watchlisted symbols. NOTE: if trading.html and watchlist.html are both
  // left open at once, their polls run independently and stack -- see
  // mak_live_quotes_status: a single tab's 6s poll is already tuned to
  // Fyers' 200 req/min cap with limited headroom, so two concurrent tabs
  // polling continuously can exceed it. Fine for occasional side-by-side
  // use; revisit with shared cross-tab polling if that becomes a problem.
  var QUOTE_POLL_MS = 6000;
  function fetchJsonSafe(url){
    return fetch(url)
      .then(function(res){ return res.json().then(function(body){ return { status: res.status, body: body }; }); })
      .catch(function(){ return null; });
  }
  function pollQuotes(){
    if (watchlist.length === 0) {
      setTimeout(pollQuotes, QUOTE_POLL_MS);
      return;
    }
    // MCX symbols (CRUDEOIL etc.) have no equity spot and aren't covered by
    // /api/fyers/quotes -- only fetch mcx-quotes.js when the watchlist
    // actually needs it, to avoid a wasted request every poll otherwise.
    var needsMcx = watchlist.some(function(s){ return MCX_SYMBOL_SET.has(s); });
    var requests = [fetchJsonSafe('/api/fyers/quotes')];
    if (needsMcx) requests.push(fetchJsonSafe('/api/fyers/mcx-quotes'));

    Promise.all(requests).then(function(results){
      var nfoResult = results[0];
      if (nfoResult) {
        if (nfoResult.status === 401) markBrokerDisconnected(); else markBrokerConnected();
      }
      var merged = {};
      if (nfoResult && nfoResult.body && nfoResult.body.quotes) {
        Object.assign(merged, nfoResult.body.quotes);
      }
      var mcxResult = results[1];
      if (mcxResult && mcxResult.body && mcxResult.body.quotes) {
        // No separate spot instrument for MCX -- the front (nearest-expiry)
        // future stands in for LTP, same substitution trading.html makes.
        Object.keys(mcxResult.body.quotes).forEach(function(sym){
          var q = mcxResult.body.quotes[sym];
          var frontFuture = q.futures && q.futures[0];
          merged[sym] = {
            ltp: (frontFuture !== null && frontFuture !== undefined) ? frontFuture : null,
            chp: q.chp !== undefined ? q.chp : null,
          };
        });
      }
      lastQuotes = merged;
      renderGrid();
    }).then(function(){ setTimeout(pollQuotes, QUOTE_POLL_MS); });
  }

  // ---------- Option-chain panel ----------
  var chainEmpty = document.getElementById('chainEmpty');
  var chainContent = document.getElementById('chainContent');
  var tsSpot = document.getElementById('tsSpot');
  var tsVix = document.getElementById('tsVix');
  var tsFut = document.getElementById('tsFut');
  var expiryTabsEl = document.getElementById('expiryTabs');
  var expiryMoreBtn = document.getElementById('expiryMoreBtn');
  var expiryDropdown = document.getElementById('expiryDropdown');
  var chainBody = document.getElementById('chainBody');

  var CHAIN_TAB_COUNT = 4; // matches the reference design: a handful of tabs + an overflow dropdown for the rest
  var chainData = null;    // last fetched /api/fyers/option-chain response
  var chainError = null;   // set only when there's no chainData to fall back to -- see fetchChain
  var selectedExpiry = null;
  var chainFetchToken = 0;      // guards against a slow, stale fetch clobbering a newer selection's render
  var chainNeedsScrollToAtm = true; // scroll to the ATM row on a fresh symbol/expiry load, not on every 6s poll refresh

  function selectSymbol(symbol){
    if (symbol === selectedSymbol) return;
    selectedSymbol = symbol;
    try { localStorage.setItem(SELECTED_SYMBOL_KEY, symbol || ''); } catch (err) {}
    selectedExpiry = null;
    chainData = null;
    chainError = null;
    chainNeedsScrollToAtm = true;
    renderGrid();
    fetchChain();
  }

  function fmtDelta(value){
    if (value === null || value === undefined) return '—';
    return value.toFixed(2);
  }

  function renderChain(){
    if (!selectedSymbol || (!chainData && !chainError)) {
      chainEmpty.textContent = 'Select a stock from your watchlist to view its option chain.';
      chainEmpty.hidden = false;
      chainContent.hidden = true;
      return;
    }
    if (!chainData && chainError) {
      chainEmpty.textContent = chainError;
      chainEmpty.hidden = false;
      chainContent.hidden = true;
      return;
    }
    chainEmpty.hidden = true;
    chainContent.hidden = false;

    tsSpot.textContent = chainData.spot !== null ? fmtNum(chainData.spot) : '—';
    tsSpot.className = 'ts-value ' + pctClass(chainData.spotChp);
    tsVix.textContent = chainData.vix !== null ? fmtNum(chainData.vix) : '—';
    tsFut.textContent = chainData.future !== null ? fmtNum(chainData.future) : '—';
    tsFut.className = 'ts-value ' + pctClass(chainData.futureChp);

    var expiries = chainData.expiries || [];
    var shown = expiries.slice(0, CHAIN_TAB_COUNT);
    var overflow = expiries.slice(CHAIN_TAB_COUNT);
    expiryTabsEl.innerHTML = shown.map(function(e){
      var active = e.expiry === selectedExpiry ? ' active' : '';
      return '<button type="button" class="expiry-tab' + active + '" data-expiry="' + e.expiry + '">' + e.date + '</button>';
    }).join('');
    expiryMoreBtn.hidden = overflow.length === 0;
    expiryDropdown.innerHTML = overflow.map(function(e){
      var active = e.expiry === selectedExpiry ? ' active' : '';
      return '<div class="expiry-option' + active + '" data-expiry="' + e.expiry + '">' + e.date + '</div>';
    }).join('');

    var rows = chainData.rows || [];
    var maxCallOi = rows.reduce(function(m, r){ return r.call ? Math.max(m, r.call.oi) : m; }, 0) || 1;
    var maxPutOi = rows.reduce(function(m, r){ return r.put ? Math.max(m, r.put.oi) : m; }, 0) || 1;
    var spot = chainData.spot;

    chainBody.innerHTML = rows.map(function(row){
      var call = row.call, put = row.put;
      var callItm = spot !== null && row.strike < spot;
      var putItm = spot !== null && row.strike > spot;
      var atm = row.strike === chainData.atmStrike;
      var callOiPct = call ? Math.round((call.oi / maxCallOi) * 100) : 0;
      var putOiPct = put ? Math.round((put.oi / maxPutOi) * 100) : 0;

      // Intrinsic Value (call) = Spot - Strike; (put) = Strike - Spot;
      // Time Value = Premium - Intrinsic. Only meaningful for whichever
      // side is actually in the money -- the OTM side's intrinsic is
      // trivially 0 (all premium is time value), which isn't the
      // interesting number here, so those cells just show '—'.
      var intrinsic = null, timeValue = null;
      if (spot !== null && callItm && call) {
        intrinsic = spot - row.strike;
        timeValue = call.ltp - intrinsic;
      } else if (spot !== null && putItm && put) {
        intrinsic = row.strike - spot;
        timeValue = put.ltp - intrinsic;
      }
      var itmValueClass = (callItm || putItm) ? 'cell-itm' : '';

      return '<tr class="' + (atm ? 'atm-row' : '') + '">' +
        '<td class="col-delta' + (callItm ? ' cell-itm' : '') + '">' + (call ? '<span class="delta-call">' + fmtDelta(call.delta) + '</span>' : '—') + '</td>' +
        '<td class="' + (callItm ? 'cell-itm' : '') + '">' + (call ? fmtNum(call.ltp) : '—') + '</td>' +
        '<td class="cell-oi cell-oi-call' + (callItm ? ' cell-itm' : '') + '" style="--pct:' + callOiPct + '%"></td>' +
        '<td class="cell-strike">' + fmtNum(row.strike) + '</td>' +
        '<td class="cell-oi cell-oi-put' + (putItm ? ' cell-itm' : '') + '" style="--pct:' + putOiPct + '%"></td>' +
        '<td class="' + (putItm ? 'cell-itm' : '') + '">' + (put ? fmtNum(put.ltp) : '—') + '</td>' +
        '<td class="col-delta' + (putItm ? ' cell-itm' : '') + '">' + (put ? '<span class="delta-put">' + fmtDelta(put.delta) + '</span>' : '—') + '</td>' +
        '<td class="' + itmValueClass + '">' + (intrinsic !== null ? fmtNum(intrinsic) : '—') + '</td>' +
        '<td class="' + itmValueClass + '">' + (timeValue !== null ? fmtNum(timeValue) : '—') + '</td>' +
        '</tr>';
    }).join('');

    if (chainNeedsScrollToAtm) {
      var atmEl = chainBody.querySelector('.atm-row');
      if (atmEl) atmEl.scrollIntoView({ block: 'center', behavior: 'auto' });
      chainNeedsScrollToAtm = false;
    }
  }

  expiryTabsEl.addEventListener('click', function(e){
    var btn = e.target.closest('.expiry-tab');
    if (!btn) return;
    selectedExpiry = btn.getAttribute('data-expiry');
    chainNeedsScrollToAtm = true;
    fetchChain();
  });
  expiryMoreBtn.addEventListener('click', function(e){
    e.stopPropagation();
    expiryDropdown.hidden = !expiryDropdown.hidden;
  });
  expiryDropdown.addEventListener('click', function(e){
    var opt = e.target.closest('.expiry-option');
    if (!opt) return;
    selectedExpiry = opt.getAttribute('data-expiry');
    chainNeedsScrollToAtm = true;
    expiryDropdown.hidden = true;
    fetchChain();
  });
  document.addEventListener('click', function(e){
    if (!e.target.closest('.chain-expiries')) expiryDropdown.hidden = true;
  });

  function fetchChain(){
    if (!selectedSymbol) {
      chainData = null;
      chainError = null;
      renderChain();
      return;
    }
    var token = ++chainFetchToken;
    var url = '/api/fyers/option-chain?symbol=' + encodeURIComponent(selectedSymbol) +
      (selectedExpiry ? '&expiry=' + encodeURIComponent(selectedExpiry) : '');
    fetch(url)
      .then(function(res){
        if (res.status === 401) markBrokerDisconnected(); else markBrokerConnected();
        return res.json().then(function(body){ return { ok: res.ok, body: body }; });
      })
      .then(function(result){
        if (token !== chainFetchToken) return; // a newer selection/expiry superseded this fetch
        if (result.ok && result.body && result.body.status === 'ok') {
          chainData = result.body;
          chainError = null;
          if (!selectedExpiry) selectedExpiry = result.body.selectedExpiry;
          renderChain();
        } else if (!chainData) {
          // Only surface an error when there's no already-working chain to
          // keep showing -- a poll hiccup on a loaded chain just silently
          // keeps the last known data (see the catch below too).
          chainError = (result.body && result.body.message) || 'Could not load the option chain for this symbol.';
          renderChain();
        }
      })
      .catch(function(){
        if (!chainData && token === chainFetchToken) {
          chainError = 'Could not load the option chain for this symbol.';
          renderChain();
        }
      });
  }

  var CHAIN_POLL_MS = 6000;
  function pollChain(){
    if (selectedSymbol) fetchChain();
    setTimeout(pollChain, CHAIN_POLL_MS);
  }

  watchlist = loadWatchlist();
  try {
    var savedSelection = localStorage.getItem(SELECTED_SYMBOL_KEY);
    if (savedSelection && watchlist.indexOf(savedSelection) !== -1) selectedSymbol = savedSelection;
  } catch (err) {}
  if (!selectedSymbol && watchlist.length > 0) selectedSymbol = watchlist[0];
  renderGrid();
  renderChain();
  pollQuotes();
  pollChain();

  fetch('source/fo-stocks.json')
    .then(function(res){ return res.json(); })
    .then(function(stocks){ allStocks = stocks.concat(MCX_ROWS); })
    .catch(function(){ /* search box just won't return suggestions until this loads */ });
</script>
</body>
</html>
