<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trading — GrabMyStone</title>
<link rel="icon" href="images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:#111111;color:#eeeeee;
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
  }
  .wrap{max-width:1240px;margin:0 auto;padding:0 24px}

  .navbar{
    position:sticky;top:0;z-index:100;
    background:#111111;border-bottom:1px solid #262626;
  }
  .navbar .wrap{
    height:58px;display:flex;align-items:center;justify-content:space-between;gap:24px;
  }
  .nav-links{display:flex;align-items:center;gap:8px}
  .nav-links a{
    padding:10px 16px;border-radius:999px;font-weight:600;font-size:13px;
    color:#c2c2c2;text-decoration:none;transition:background .15s ease,color .15s ease;
  }
  .nav-links a:hover{background:#1c1c1c;color:#ffffff}
  .nav-links a.up{color:#2ecc71}
  .nav-links a.up:hover{background:rgba(46,204,113,.12)}
  .nav-links a.down{color:#ff4d4f}
  .nav-links a.down:hover{background:rgba(255,77,79,.12)}

  .nav-tickers{display:flex;align-items:center;gap:22px}
  .ticker{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
  .ticker-label{color:#787878}
  .ticker-value{font-variant-numeric:tabular-nums;color:#eeeeee}
  .ticker-divider{width:1px;height:16px;background:#262626}
  .nav-links a.active{background:#1c1c1c;color:#ffffff}
  .nav-links a.down.active{background:rgba(255,77,79,.15);color:#ff4d4f}
  .nav-links a.up.active{background:rgba(46,204,113,.15);color:#2ecc71}

  main{padding:32px 0 64px}

  .grid-toolbar{
    display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px;
  }
  .search-wrap{position:relative;width:220px}
  .search-input{
    background:#161616 url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%23787878" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>') no-repeat 14px center/14px;
    border:1px solid #262626;color:#eeeeee;
    font-family:inherit;font-size:13px;font-weight:600;
    padding:9px 34px 9px 38px;border-radius:8px;
    width:100%;
  }
  .search-input::placeholder{color:#787878;font-weight:500}
  .search-input:hover{border-color:#3a3a3a}
  .search-input:focus{outline:none;border-color:#4a4a4a}
  .search-clear{
    position:absolute;top:50%;right:8px;transform:translateY(-50%);
    width:20px;height:20px;border:none;border-radius:999px;
    background:#262626;color:#c2c2c2;font-size:15px;line-height:1;
    cursor:pointer;display:flex;align-items:center;justify-content:center;
    font-family:inherit;padding:0;
  }
  .search-clear:hover{background:#3a3a3a;color:#ffffff}
  .search-clear[hidden]{display:none}
  .grid-toolbar-left{display:flex;align-items:center;gap:16px}
  .toolbar-divider{width:1px;height:24px;background:#262626;flex-shrink:0}
  .segment-toggle{
    display:flex;align-items:center;background:#1a1a1a;border:1px solid #262626;
    border-radius:999px;padding:3px;gap:2px;flex-shrink:0;
  }
  .segment-btn{
    border:none;background:transparent;color:#787878;font-size:12px;font-weight:700;
    letter-spacing:.02em;padding:7px 16px;border-radius:999px;cursor:pointer;
    font-family:inherit;transition:background .15s ease,color .15s ease;
  }
  .segment-btn:hover{color:#c2c2c2}
  .segment-btn.active{background:#2ecc71;color:#0d1f14}
  .grid-toolbar-right{display:flex;align-items:center;gap:18px}
  .connect-btn{
    display:inline-flex;align-items:center;padding:9px 16px;border-radius:8px;
    background:#2ecc71;color:#0d1f14;font-size:13px;font-weight:700;text-decoration:none;
    transition:background .15s ease;
  }
  .connect-btn:hover{background:#3ee082}
  .connect-btn.connected{background:#1c1c1c;color:#ff4d4f;border:1px solid #262626}
  .connect-btn.connected:hover{background:rgba(255,77,79,.12)}
  .clock{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:#c2c2c2}
  .clock-tz{
    font-size:11px;font-weight:700;color:#787878;background:#1c1c1c;padding:2px 7px;border-radius:999px;
  }
  .clock-value{font-variant-numeric:tabular-nums;color:#eeeeee}

  .grid-card{
    background:#161616;border:1px solid #262626;border-radius:10px;overflow:hidden;
  }
  .grid-scroll{overflow:auto;max-height:calc(100vh - 220px)}
  table{width:100%;border-collapse:collapse;min-width:1040px}
  thead th{
    position:sticky;top:0;z-index:1;
    background:#1a1a1a;
    text-align:right;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
    color:#787878;padding:12px 16px;border-bottom:1px solid #262626;white-space:nowrap;
  }
  thead th:first-child{text-align:left}
  thead th.sortable{cursor:pointer;user-select:none}
  thead th.sortable:hover{color:#c2c2c2}
  thead th.sort-asc::after{content:" \25B2"}
  thead th.sort-desc::after{content:" \25BC"}
  tbody td{
    padding:12px 16px;font-size:13px;text-align:right;border-bottom:1px solid #1e1e1e;
    font-variant-numeric:tabular-nums;color:#eeeeee;white-space:nowrap;
  }
  tbody td:first-child{text-align:left;font-weight:700}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover td{background:#1c1c1c}
  .price-up{color:#2ecc71}
  .price-down{color:#ff4d4f}
  .price-pending{color:#4a4a4a}

  // Lot sizes from Fyers' live NSE_FO symbol master (idx futures, not equities,
  // so they don't live in fo-stocks.json alongside the 210 stocks).
  var INDEX_ROWS = [["NIFTY", 65], ["BANKNIFTY", 30]];
  // MCX lot sizes (contract unit, not currency) -- update here if the
  // exchange revises them; there's no local JSON source for these like
  // fo-stocks.json is for equities. GOLDM/SILVERM are the Mini contracts,
  // not the full-size GOLD/SILVER ones.
  var MCX_ROWS = [["CRUDEOIL", 100], ["NATURALGAS", 1250], ["GOLDM", 10], ["SILVERM", 5]];

  var gridBody = document.getElementById('gridBody');
  var lastPrices = {};
  var lotBySymbol = {};

  var originalOrder = [];

  function renderRows(stocks){
    originalOrder = stocks.map(function(stock){ return stock[0]; });
    var rowsHtml = stocks.map(function(stock){
      var symbol = stock[0], lot = stock[1];
      lotBySymbol[symbol] = lot;
      return '<tr data-symbol="' + symbol + '">' +
        '<td>' + symbol + '</td>' +
        '<td class="price-pending c-ltp">—</td>' +
        '<td class="price-pending c-chg">—</td>' +
        '<td>' + lot.toLocaleString('en-IN') + '</td>' +
        '<td class="price-pending c-fut0">—</td>' +
        '<td class="price-pending c-fut1">—</td>' +
        '<td class="price-pending c-fut2">—</td>' +
        '<td class="price-pending c-spread1m">—</td>' +
        '<td class="price-pending c-spread2m">—</td>' +
        '<td class="price-pending c-profit1m">—</td>' +
        '<td class="price-pending c-profit2m">—</td>' +
        '</tr>';
    }).join('');
    gridBody.innerHTML = rowsHtml;
  }

  function setCell(cell, value, previous){
    cell.classList.remove('price-pending');
    cell.textContent = value.toLocaleString('en-IN', { maximumFractionDigits: 2 });
    cell.classList.remove('price-up', 'price-down');
    if (previous !== null && previous !== undefined) {
      if (value > previous) cell.classList.add('price-up');
      else if (value < previous) cell.classList.add('price-down');
    }
  }

  // Unlike setCell (which colors by whether a value moved since the last
  // poll), % change is already signed relative to prev close, so it's
  // colored by its own sign rather than compared against the previous poll.
  function setChangeCell(cell, value){
    cell.classList.remove('price-pending', 'price-up', 'price-down');
    cell.textContent = (value > 0 ? '+' : '') + value.toFixed(2) + '%';
    if (value > 0) cell.classList.add('price-up');
    else if (value < 0) cell.classList.add('price-down');
  }

  function applyQuotes(quotes){
    Object.keys(quotes).forEach(function(symbol){
      var row = gridBody.querySelector('tr[data-symbol="' + symbol + '"]');
      if (!row) return;
      var q = quotes[symbol];
      var prev = lastPrices[symbol] || {};
      var next = {};

      if (q.ltp !== null && q.ltp !== undefined) {
        setCell(row.querySelector('.c-ltp'), q.ltp, prev.ltp);
        next.ltp = q.ltp;
      } else {
        next.ltp = prev.ltp;
      }

      if (q.chp !== null && q.chp !== undefined) {
        setChangeCell(row.querySelector('.c-chg'), q.chp);
        next.chp = q.chp;
      } else {
        next.chp = prev.chp;
      }

      var futClasses = ['.c-fut0', '.c-fut1', '.c-fut2'];
      next.futures = [];
      q.futures.forEach(function(price, i){
        next.futures[i] = (price !== null && price !== undefined) ? price : (prev.futures && prev.futures[i]);
        if (price !== null && price !== undefined) {
          setCell(row.querySelector(futClasses[i]), price, prev.futures && prev.futures[i]);
        }
      });

      // 1M = Near Month vs Current (front) Future spread; 2M = Far Month vs
      // Near Month spread. Profit is that spread's rupee value for one lot.
      var lot = lotBySymbol[symbol] || 0;
      if (next.futures[0] !== undefined && next.futures[1] !== undefined) {
        var spread1m = next.futures[1] - next.futures[0];
        var prevSpread1m = (prev.futures && prev.futures[0] !== undefined && prev.futures[1] !== undefined)
          ? prev.futures[1] - prev.futures[0] : undefined;
        setCell(row.querySelector('.c-spread1m'), spread1m, prevSpread1m);
        setCell(row.querySelector('.c-profit1m'), spread1m * lot, prevSpread1m !== undefined ? prevSpread1m * lot : undefined);
      }
      if (next.futures[1] !== undefined && next.futures[2] !== undefined) {
        var spread2m = next.futures[2] - next.futures[1];
        var prevSpread2m = (prev.futures && prev.futures[1] !== undefined && prev.futures[2] !== undefined)
          ? prev.futures[2] - prev.futures[1] : undefined;
        setCell(row.querySelector('.c-spread2m'), spread2m, prevSpread2m);
        setCell(row.querySelector('.c-profit2m'), spread2m * lot, prevSpread2m !== undefined ? prevSpread2m * lot : undefined);
      }

      lastPrices[symbol] = next;
    });
  }

  // Sorting for the 1M/2M Profit columns. Values are derived on demand from
  // lastPrices/lotBySymbol (the same values setCell just wrote into the
  // cells) rather than cached separately, so a sort always reflects the
  // latest poll. applySort() is called again after every applyQuotes() so
  // an active sort stays correct as prices keep updating live.
  var SORT_VALUE_GETTERS = {
    profit1m: function(symbol){
      var f = lastPrices[symbol] && lastPrices[symbol].futures;
      if (!f || f[0] === undefined || f[1] === undefined) return null;
      return (f[1] - f[0]) * (lotBySymbol[symbol] || 0);
    },
    profit2m: function(symbol){
      var f = lastPrices[symbol] && lastPrices[symbol].futures;
      if (!f || f[1] === undefined || f[2] === undefined) return null;
      return (f[2] - f[1]) * (lotBySymbol[symbol] || 0);
    }
  };
  var sortState = { column: null, direction: 'desc' };

  function restoreOriginalOrder(){
    originalOrder.forEach(function(symbol){
      var row = gridBody.querySelector('tr[data-symbol="' + symbol + '"]');
      if (row) gridBody.appendChild(row);
    });
  }

  function applySort(){
    if (!sortState.column) { restoreOriginalOrder(); return; }
    var getValue = SORT_VALUE_GETTERS[sortState.column];
    var rowsArr = Array.prototype.slice.call(gridBody.querySelectorAll('tr'));
    rowsArr.sort(function(a, b){
      var av = getValue(a.getAttribute('data-symbol'));
      var bv = getValue(b.getAttribute('data-symbol'));
      if (av === null && bv === null) return 0;
      if (av === null) return 1; // rows without data yet always sink to the bottom
      if (bv === null) return -1;
      return sortState.direction === 'asc' ? av - bv : bv - av;
    });
    rowsArr.forEach(function(row){ gridBody.appendChild(row); });
  }

  // 3-state cycle per column: desc -> asc -> back to original (unsorted) order.
  function bindSortHeader(id, column){
    var th = document.getElementById(id);
    th.addEventListener('click', function(){
      if (sortState.column === column) {
        if (sortState.direction === 'desc') {
          sortState.direction = 'asc';
        } else {
          sortState.column = null;
          sortState.direction = 'desc';
        }
      } else {
        sortState.column = column;
        sortState.direction = 'desc';
      }
      document.getElementById('thProfit1m').classList.remove('sort-asc', 'sort-desc');
      document.getElementById('thProfit2m').classList.remove('sort-asc', 'sort-desc');
      if (sortState.column) th.classList.add(sortState.direction === 'asc' ? 'sort-asc' : 'sort-desc');
      applySort();
    });
  }
  bindSortHeader('thProfit1m', 'profit1m');
  bindSortHeader('thProfit2m', 'profit2m');

  var lastIndices = {};
  var tickerEls = { NIFTY: document.getElementById('tickerNifty'), BANKNIFTY: document.getElementById('tickerBanknifty'), VIX: document.getElementById('tickerVix') };
  function applyIndices(indices){
    Object.keys(tickerEls).forEach(function(name){
      var value = indices && indices[name];
      if (value === null || value === undefined) return;
      setCell(tickerEls[name], value, lastIndices[name]);
      lastIndices[name] = value;
    });
  }

  var connectBtn = document.getElementById('connectBtn');
  function markBrokerConnected(){
    if (connectBtn.classList.contains('connected')) return;
    connectBtn.setAttribute('href', '/api/fyers/logout');
    connectBtn.classList.add('connected');
    connectBtn.textContent = 'Disconnect';
  }
  function markBrokerDisconnected(){
    connectBtn.setAttribute('href', '/api/fyers/login');
    connectBtn.classList.remove('connected');
    connectBtn.textContent = 'Connect Broker';
  }
  // Reflect the (already-shared, cookie-based) login state immediately on
  // load, instead of waiting on the slower quotes polling to discover it
  // indirectly via a non-401 response.
  fetch('/api/fyers/status').then(function(res){ return res.json(); }).then(function(body){
    if (body && body.loggedIn) markBrokerConnected();
  }).catch(function(){});
  connectBtn.addEventListener('click', function(e){
    // Connect Broker still navigates normally (it's a real OAuth redirect).
    // Disconnect logs out in the background instead of navigating, so the
    // page never reloads and the last fetched grid values stay on screen.
    if (!connectBtn.classList.contains('connected')) return;
    e.preventDefault();
    fetch('/api/fyers/logout').catch(function(){}).then(function(){ markBrokerDisconnected(); });
  });

  var QUOTE_POLL_MS = 6000;
  var currentSegment = 'fno'; // 'fno' | 'mcx'
  var pollTimer = null;

  function pollQuotes(){
    var endpoint = currentSegment === 'mcx' ? '/api/fyers/mcx-quotes' : '/api/fyers/quotes';
    fetch(endpoint)
      .then(function(res){
        if (res.status !== 401) markBrokerConnected();
        return res.json().then(function(body){ return { ok: res.ok, body: body }; });
      })
      .then(function(result){
        if (result.ok && result.body.quotes) {
          if (currentSegment === 'mcx') {
            // MCX futures have no separate spot instrument -- the front
            // (nearest-expiry) future stands in for LTP, same value shown
            // in the Current Future Price column.
            Object.keys(result.body.quotes).forEach(function(symbol){
              var q = result.body.quotes[symbol];
              q.ltp = (q.futures && q.futures[0] !== null && q.futures[0] !== undefined) ? q.futures[0] : undefined;
            });
          }
          applyQuotes(result.body.quotes);
        }
        if (result.ok && result.body.indices) applyIndices(result.body.indices);
        applySort();
      })
      .catch(function(){ /* keep last known values on transient network errors */ })
      .then(function(){ pollTimer = setTimeout(pollQuotes, QUOTE_POLL_MS); });
  }

  var FNO_STOCKS_RESOLVED = [];
  var segmentToggle = document.getElementById('segmentToggle');

  function switchSegment(segment){
    if (segment === currentSegment) return;
    currentSegment = segment;
    lastPrices = {};
    sortState = { column: null, direction: 'desc' };
    document.getElementById('thProfit1m').classList.remove('sort-asc', 'sort-desc');
    document.getElementById('thProfit2m').classList.remove('sort-asc', 'sort-desc');
    var buttons = segmentToggle.querySelectorAll('.segment-btn');
    for (var i = 0; i < buttons.length; i++) {
      buttons[i].classList.toggle('active', buttons[i].getAttribute('data-segment') === segment);
    }
    renderRows(segment === 'mcx' ? MCX_ROWS : INDEX_ROWS.concat(FNO_STOCKS_RESOLVED));
    applySearchFilter();
    if (pollTimer) clearTimeout(pollTimer);
    pollQuotes();
  }

  segmentToggle.addEventListener('click', function(e){
    var btn = e.target.closest('.segment-btn');
    if (!btn) return;
    switchSegment(btn.getAttribute('data-segment'));
  });

  var searchInput = document.getElementById('stockSearch');
  var searchClear = document.getElementById('stockSearchClear');

  function applySearchFilter(){
    var term = searchInput.value.trim().toUpperCase();
    searchClear.hidden = term.length === 0;
    var rows = gridBody.querySelectorAll('tr');
    for (var i = 0; i < rows.length; i++) {
      var symbol = rows[i].getAttribute('data-symbol') || '';
      rows[i].style.display = symbol.indexOf(term) !== -1 ? '' : 'none';
    }
  }

  searchInput.addEventListener('input', applySearchFilter);
  searchClear.addEventListener('click', function(){
    searchInput.value = '';
    applySearchFilter();
    searchInput.focus();
  });

  fetch('source/fo-stocks.json')
    .then(function(res){ return res.json(); })
    .catch(function(){ return FO_STOCKS_FALLBACK; })
    .then(function(stocks){
      FNO_STOCKS_RESOLVED = stocks;
      renderRows(INDEX_ROWS.concat(stocks));
      pollQuotes();
    });

  var clockEl = document.getElementById('clockValue');
  var clockFmt = new Intl.DateTimeFormat('en-IN', {
    timeZone: 'Asia/Kolkata',
    day: '2-digit', month: 'short', year: 'numeric',
    hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true
  });
  function tickClock(){
    clockEl.textContent = clockFmt.format(new Date());
  }
  tickClock();
  setInterval(tickClock, 1000);
</script>

</body>
</html>
