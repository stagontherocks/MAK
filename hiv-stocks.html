<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>High IV Stocks — GrabMyStone</title>
<link rel="icon" href="images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:#111111;color:#eeeeee;
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
  }
  .wrap{max-width:1240px;margin:0 auto;padding:0 24px}

  .navbar{
    position:sticky;top:0;z-index:100;
    background:#111111;border-bottom:1px solid #262626;
  }
  .navbar .wrap{
    height:58px;display:flex;align-items:center;justify-content:space-between;gap:24px;
  }
  .nav-links{display:flex;align-items:center;gap:8px}
  .nav-links a{
    padding:10px 16px;border-radius:999px;font-weight:600;font-size:13px;
    color:#c2c2c2;text-decoration:none;transition:background .15s ease,color .15s ease;
  }
  .nav-links a:hover{background:#1c1c1c;color:#ffffff}
  .nav-links a.up{color:#2ecc71}
  .nav-links a.up:hover{background:rgba(46,204,113,.12)}
  .nav-links a.down{color:#ff4d4f}
  .nav-links a.down:hover{background:rgba(255,77,79,.12)}
  .nav-links a.active{background:#1c1c1c;color:#ffffff}
  .nav-links a.down.active{background:rgba(255,77,79,.15);color:#ff4d4f}
  .nav-links a.up.active{background:rgba(46,204,113,.15);color:#2ecc71}

  .connect-btn{
    display:inline-flex;align-items:center;padding:9px 16px;border-radius:8px;
    background:#2ecc71;color:#0d1f14;font-size:13px;font-weight:700;text-decoration:none;
    transition:background .15s ease;
  }
  .connect-btn:hover{background:#3ee082}
  .connect-btn.connected{background:#1c1c1c;color:#ff4d4f;border:1px solid #262626}
  .connect-btn.connected:hover{background:rgba(255,77,79,.12)}

  main{padding:32px 0 64px}
  .screener-toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px}
  .screener-status{font-size:13px;font-weight:600;color:#787878}
  .refresh-btn{
    flex-shrink:0;display:inline-flex;align-items:center;padding:8px 14px;border-radius:8px;
    background:#1c1c1c;border:1px solid #262626;color:#eeeeee;font-size:13px;font-weight:600;
    cursor:pointer;transition:background .15s ease;
  }
  .refresh-btn:hover{background:#262626}
  .refresh-btn:disabled{opacity:.5;cursor:not-allowed}

  .grid-card{
    background:#161616;border:1px solid #262626;border-radius:10px;overflow:hidden;
  }
  .grid-scroll{overflow:auto;max-height:calc(100vh - 220px)}
  table{width:100%;border-collapse:collapse;min-width:640px}
  thead th{
    position:sticky;top:0;z-index:1;
    background:#1a1a1a;
    text-align:right;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
    color:#787878;padding:12px 16px;border-bottom:1px solid #262626;white-space:nowrap;
  }
  thead th:first-child{text-align:left}
  tbody td{
    padding:12px 16px;font-size:13px;text-align:right;border-bottom:1px solid #1e1e1e;
    font-variant-numeric:tabular-nums;color:#eeeeee;white-space:nowrap;
  }
  tbody td:first-child{text-align:left;font-weight:700}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover td{background:#1c1c1c}
  td.down{color:#ff4d4f}
</style>
</head>
<body>

<header class="navbar">
  <div class="wrap">
    <nav class="nav-links">
      <a href="trading.html">Arbitrage</a>
      <a href="top-losers.html" class="down">Top Losers</a>
      <a href="top-gainers.html">Top Gainers</a>
      <a href="hiv-stocks.html" class="active">High IV</a>
      <a href="watchlist.html">Watchlist</a>
      <a href="positions.html">Positions</a>
    </nav>
    <a href="/api/fyers/login" class="connect-btn" id="connectBtn">Connect Broker</a>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="screener-toolbar">
      <div class="screener-status" id="screenerStatus">Starting screen...</div>
      <button type="button" class="refresh-btn" id="refreshBtn">Refresh</button>
    </div>
    <div class="grid-card">
      <div class="grid-scroll">
        <table>
          <thead>
            <tr>
              <th>Stock Name</th>
              <th>Decline From 6M High</th>
              <th>Realized Vol Rank</th>
              <th>Option IV</th>
            </tr>
          </thead>
          <tbody id="screenerBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</main>

<script>
  var connectBtn = document.getElementById('connectBtn');
  function markBrokerConnected(){
    if (connectBtn.classList.contains('connected')) return;
    connectBtn.setAttribute('href', '/api/fyers/logout');
    connectBtn.classList.add('connected');
    connectBtn.textContent = 'Disconnect';
  }
  function markBrokerDisconnected(){
    connectBtn.setAttribute('href', '/api/fyers/login');
    connectBtn.classList.remove('connected');
    connectBtn.textContent = 'Connect Broker';
  }
  // Reflect the (already-shared, cookie-based) login state immediately on
  // load, instead of waiting on the slower screener polling to discover it
  // indirectly via a non-401 response.
  fetch('/api/fyers/status').then(function(res){ return res.json(); }).then(function(body){
    if (body && body.loggedIn) markBrokerConnected();
  }).catch(function(){});
  connectBtn.addEventListener('click', function(e){
    if (!connectBtn.classList.contains('connected')) return;
    e.preventDefault();
    fetch('/api/fyers/logout').catch(function(){}).then(function(){
      markBrokerDisconnected();
      // A disconnect invalidates any cached scan -- reconnecting starts fresh.
      clearCache();
      rows = [];
      renderRows();
      statusEl.textContent = 'Disconnected. Click Refresh once reconnected to run the screener.';
    });
  });

  var BATCH_LIMIT = 10;
  var CACHE_KEY = 'hivScreenerCache_v1';
  var rows = [];
  var isScanning = false;
  var statusEl = document.getElementById('screenerStatus');
  var tbody = document.getElementById('screenerBody');
  var refreshBtn = document.getElementById('refreshBtn');

  // Cache is written only once a scan completes successfully (see fetchBatch's
  // "Done" branch), so its mere presence means "a full completed run" -- no
  // separate completion flag needed. Kept in localStorage (per-browser, not
  // synced anywhere) purely so navigating back to this page doesn't re-run
  // the ~212-symbol screen every time.
  function loadCache(){
    try {
      var raw = localStorage.getItem(CACHE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (err) { return null; }
  }
  function saveCache(){
    try {
      localStorage.setItem(CACHE_KEY, JSON.stringify({ rows: rows, statusText: statusEl.textContent }));
    } catch (err) { /* storage unavailable/full -- keep working without persistence */ }
  }
  function clearCache(){
    try { localStorage.removeItem(CACHE_KEY); } catch (err) {}
  }

  function renderRows(){
    var sorted = rows.slice().sort(function(a, b){ return b.volRank - a.volRank; });
    tbody.innerHTML = sorted.map(function(r){
      return '<tr>' +
        '<td>' + r.symbol + '</td>' +
        '<td class="down">' + r.declineFromHighPct.toFixed(1) + '%</td>' +
        '<td>' + r.volRank.toFixed(0) + '</td>' +
        '<td>' + (r.optionIv !== null && r.optionIv !== undefined ? r.optionIv.toFixed(1) : '—') + '</td>' +
        '</tr>';
    }).join('');
  }

  function fetchBatch(offset){
    fetch('/api/fyers/screener?offset=' + offset + '&limit=' + BATCH_LIMIT)
      .then(function(res){
        if (res.status === 401) {
          statusEl.textContent = 'Connect your broker (top right) to run the screener.';
          return null;
        }
        markBrokerConnected();
        return res.json();
      })
      .then(function(body){
        if (!body) { isScanning = false; refreshBtn.disabled = false; return; }
        if (body.status !== 'ok') {
          statusEl.textContent = 'Screener failed: ' + (body.message || body.error || 'unknown error');
          isScanning = false;
          refreshBtn.disabled = false;
          return;
        }
        rows = rows.concat(body.results);
        renderRows();
        var scanned = Math.min(offset + BATCH_LIMIT, body.total);
        if (body.nextOffset !== null) {
          statusEl.textContent = 'Screening ' + scanned + '/' + body.total + '...';
          fetchBatch(body.nextOffset);
        } else {
          statusEl.textContent = 'Done — ' + rows.length + ' match' + (rows.length === 1 ? '' : 'es') + ' found (of ' + body.total + ' F&O stocks screened).';
          isScanning = false;
          refreshBtn.disabled = false;
          saveCache();
        }
      })
      .catch(function(){
        statusEl.textContent = 'Network error, retrying...';
        setTimeout(function(){ fetchBatch(offset); }, 3000);
      });
  }

  function startScan(){
    if (isScanning) return;
    isScanning = true;
    refreshBtn.disabled = true;
    rows = [];
    renderRows();
    statusEl.textContent = 'Starting screen...';
    fetchBatch(0);
  }

  refreshBtn.addEventListener('click', function(){
    clearCache();
    startScan();
  });

  // Don't re-run the ~212-symbol screen on every visit: if a completed scan
  // is cached, show it immediately and wait for an explicit Refresh click
  // (or a disconnect/reconnect, which clears the cache -- see the connectBtn
  // handler above). Only auto-run when there's nothing cached yet.
  var cached = loadCache();
  if (cached) {
    rows = cached.rows || [];
    renderRows();
    statusEl.textContent = (cached.statusText || 'Loaded cached results.') + ' Click Refresh to rescan.';
  } else {
    startScan();
  }
</script>
</body>
</html>
